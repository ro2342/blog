<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monopoly (Taylor's Version)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Small inline style for setup only */
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen"
        style="position:fixed; inset:0; background:var(--bg); z-index:20000; display:flex; flex-direction:column; align-items:center; justify-content:center; transition: opacity 0.5s ease;">
        <img src="logo.png" class="loading-logo" alt="Monopoly (Taylor's Version) Logo"
            style="width: 200px; max-width: 80%; margin-bottom: 20px;">
        <div class="loader-spinner"></div>
        <p style="margin-top:15px; color:#888; font-size:0.9rem">Loading Era...</p>
    </div>

    <!-- Setup (Hidden initially) -->
    <div id="setup"
        style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:none; flex-direction:column; align-items:center; justify-content:center;">
        <img src="logo.png" alt="Logo" style="width: 150px; margin-bottom: 20px;">
        <div id="setup-box"
            style="background:var(--md-surface); padding:25px; border-radius:24px; width:90%; max-width:450px; border:1px solid #333;">
            <div id="player-inputs"></div>
            <div style="display:flex; gap:10px; margin-top:15px">
                <button class="m3-btn" style="flex:1" onclick="addP()">+ Player</button>
                <button class="m3-btn" style="flex:2; background:#fff" onclick="startGame()">Start Show</button>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <div class="center-dash">
            <img src="logo.png" class="center-logo"
                style="width: 120px; opacity: 0.15; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0;">
            <button id="fs-btn"
                style="position:absolute; top:10px; right:10px; color:#666; background:none; border:1px solid #444; padding:5px; border-radius:5px; z-index: 10;"
                onclick="toggleFS()">FULLSCREEN</button>
            <div id="status-row" style="z-index: 10;"></div>
            <div class="dice-box" onclick="toss()" style="cursor:pointer; z-index: 10;">
                <div class="scene">
                    <div class="cube" id="d1-cube">
                        <div class="face face1">1</div>
                        <div class="face face2">2</div>
                        <div class="face face3">3</div>
                        <div class="face face4">4</div>
                        <div class="face face5">5</div>
                        <div class="face face6">6</div>
                    </div>
                </div>
                <div class="scene">
                    <div class="cube" id="d2-cube">
                        <div class="face face1">1</div>
                        <div class="face face2">2</div>
                        <div class="face face3">3</div>
                        <div class="face face4">4</div>
                        <div class="face face5">5</div>
                        <div class="face face6">6</div>
                    </div>
                </div>
            </div>
            <!-- Old button removed -->
            <!-- Floating Action Button -->
            <!-- Floating Action Buttons -->
            <div
                style="display:flex; gap:15px; justify-content:center; align-items:center; margin-top:20px; width:100%">
                <button class="fab-manage" onclick="openManage()" title="Manage Properties" style="margin:0"></button>
                <button class="fab-trade" onclick="transfer(-1)" title="Trade" style="margin:0"></button>
            </div>
            <div id="log-box"
                style="margin-top:10px; font-size:0.6rem; color:#888; height:40px; overflow:hidden; text-align:center">
            </div>
        </div>
    </div>

    <div id="modal-turn" class="ui-modal" style="background:#d1c4e9; color:black; border:2px solid #673ab7">
        <h1 id="turn-msg">YOUR TURN</h1>
    </div>

    <div id="modal-buy" class="ui-modal">
        <h2 style="margin-bottom:10px">Opportunity!</h2>
        <div id="buy-card-area" style="display:flex; justify-content:center; margin:15px 0">
            <!-- Deed Card will be injected here -->
        </div>
        <div id="buy-actions" style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <div id="modal-pay" class="ui-modal">
        <h2>Payment</h2>
        <p id="pay-msg" style="margin:15px 0"></p>
        <button class="m3-btn" id="pay-btn" style="width:100%">Pay Now</button>
    </div>

    <div id="modal-manage" class="ui-modal modal-flex-container" style="width:90%; max-width:900px;">
        <div class="modal-header-fixed">
            <h2 style="margin:0">Your Properties</h2>
            <button onclick="closeModal('modal-manage')" class="m3-btn"
                style="width:auto; height:32px; padding:0 12px; font-size:1.2rem; display:flex; align-items:center;">✕</button>
        </div>
        <div id="manage-list" class="modal-content-scroll"></div>
    </div>

    <div id="modal-confirm" class="ui-modal" style="z-index: 11000;">
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-msg" style="margin:20px 0"></p>
        <div style="display:flex; gap:10px">
            <button id="confirm-yes-btn" class="m3-btn" style="flex:1; background:#f44336; color:white">Yes</button>
            <button class="m3-btn" style="flex:1" onclick="closeModal('modal-confirm')">No</button>
        </div>
    </div>

    <div id="modal-fail" class="ui-modal" style="background:#f44336; color:white;">
        <h1>BANKRUPTCY!</h1>
        <p id="fail-msg" style="margin:15px 0"></p>
        <button class="m3-btn" style="background:white" onclick="location.reload()">Restart Game</button>
    </div>

    <div id="modal-card" class="ui-modal" style="background:#673ab7; color:white;">
        <h1>Chance or Fate?</h1>
        <p id="card-msg" style="margin:20px 0; font-size:1.2rem; min-height:60px"></p>
        <button class="m3-btn" style="background:white" onclick="closeModal('modal-card')">OK</button>
    </div>

    <!-- NEW MODALS -->
    <div id="modal-alert" class="ui-modal" style="z-index: 10000;">
        <h2 id="alert-title">Alert</h2>
        <p id="alert-msg" style="margin:20px 0"></p>
        <button class="m3-btn" onclick="closeModal('modal-alert')">OK</button>
    </div>

    <!-- Restored Trade Picker Modal -->
    <div id="modal-trade" class="ui-modal">
        <h2>Choose a Partner</h2>
        <p id="trade-prop-name"></p>
        <select id="trade-target"
            style="width:100%; padding:10px; margin:20px 0; border-radius:8px; font-size:1.1rem"></select>
        <div style="display:flex; gap:10px; justify-content:center">
            <button class="m3-btn" onclick="initNegotiation()">Start</button>
            <button class="m3-btn" style="background:#ccc" onclick="closeModal('modal-trade')">Cancel</button>
        </div>
        <!-- Hidden elements to prevent JS errors if referenced blindly -->
        <input type="number" id="trade-price" style="display:none">
    </div>

    <div id="modal-negotiation" class="ui-modal" style="display:none">
        <div
            style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; border-bottom:1px solid #333">
            <h2 style="color:gold; margin:0">🤝 Negotiation Center</h2>
            <button onclick="closeModal('modal-negotiation')"
                style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer">✕</button>
        </div>

        <div style="flex:1; overflow-y:auto; padding:20px; display:flex; gap:20px; flex-wrap:wrap">
            <!-- Left Side: YOU (Initiator) -->
            <div
                style="flex:1; min-width:300px; background:#2a2a2a; padding:15px; border-radius:12px; border:1px solid #444">
                <h3 id="trade-left-name" style="color:#4caf50; border-bottom:2px solid #4caf50; padding-bottom:5px">You
                </h3>

                <div style="margin:15px 0">
                    <label>💰 Money to offer ($)</label>
                    <input type="number" id="trade-left-money" value="0" min="0" step="10"
                        onchange="updateTradeBalance()"
                        style="width:100%; padding:10px; background:#333; border:1px solid #555; color:white; border-radius:8px; font-size:1.1rem">
                    <div id="trade-left-balance" style="font-size:0.8rem; color:#aaa; margin-top:5px; text-align:right">
                        Balance: $1500</div>
                </div>

                <div style="margin:15px 0">
                    <label>🏠 Properties to give</label>
                    <div id="trade-left-props"
                        style="margin-top:5px; max-height:200px; overflow-y:auto; border:1px solid #444; padding:5px; border-radius:8px">
                        <!-- Checkboxes generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Icon Center -->
            <div style="display:flex; align-items:center; justify-content:center; flex-direction:column">
                <div style="font-size:2rem">⇄</div>
            </div>

            <!-- Right Side: THEM (Target) -->
            <div
                style="flex:1; min-width:300px; background:#2a2a2a; padding:15px; border-radius:12px; border:1px solid #444">
                <h3 id="trade-right-name" style="color:#2196f3; border-bottom:2px solid #2196f3; padding-bottom:5px">
                </h3>

                <div style="margin:15px 0">
                    <label>💰 Money to receive ($)</label>
                    <input type="number" id="trade-right-money" value="0" min="0" step="10"
                        onchange="updateTradeBalance()"
                        style="width:100%; padding:10px; background:#333; border:1px solid #555; color:white; border-radius:8px; font-size:1.1rem">
                    <div id="trade-right-balance"
                        style="font-size:0.8rem; color:#aaa; margin-top:5px; text-align:right">Balance: $1500</div>
                </div>

                <div style="margin:15px 0">
                    <label>🏠 Properties to receive</label>
                    <div id="trade-right-props"
                        style="margin-top:5px; max-height:200px; overflow-y:auto; border:1px solid #444; padding:5px; border-radius:8px">
                        <!-- Checkboxes generated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div id="trade-actions"
            style="padding:20px; border-top:1px solid #333; display:flex; gap:10px; justify-content:flex-end; background:#222">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <div id="modal-auction" class="ui-modal" style="background:#222; color:white; border:2px solid gold">
        <h2 style="color:gold">🔨 Auction!</h2>
        <h3 id="auc-prop" style="margin-top:10px"></h3>

        <div style="margin:20px 0; text-align:center">
            <p style="font-size:0.8rem; color:#888">Current Bid</p>
            <div id="auc-bid" style="font-size:2rem; font-weight:bold; color:gold">$0</div>
            <p id="auc-leader" style="font-size:0.9rem">No one</p>
        </div>

        <div style="background:#333; padding:15px; border-radius:15px">
            <p id="auc-turn" style="margin-bottom:10px">Turn: Rod 1</p>
            <div style="display:flex; gap:10px">
                <button class="m3-btn" style="flex:1; background:gold; color:black" onclick="bidAuction()">Bid
                    (+$10)</button>
                <button class="m3-btn" style="flex:1; background:#f44336; color:white"
                    onclick="passAuction()">Pass</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
