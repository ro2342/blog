<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Termo Clone - Rod Indica</title>
    <style>
        :root {
            --bg-color: #6e5c62; /* Tom mais suave e 'cozy' do original */
            --tile-bg: #3e3a3b;
            --correct: #4c9c84;
            --present: #d4a35c;
            --absent: #312a2c;
            --text: #ffffff;
            --border: #4d4447;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Menu de Seleção Inicial */
        #menu {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .btn-mode {
            padding: 20px 40px;
            border: none;
            border-radius: 8px;
            background: var(--tile-bg);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Game Board */
        #game-container {
            flex-grow: 1;
            display: grid;
            gap: 15px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            justify-content: center;
            align-content: center;
        }

        .board { display: grid; gap: 5px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

        .tile {
            width: 55px;
            height: 55px;
            background: var(--tile-bg);
            border: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: transform 0.1s;
        }

        /* Teclado Estilizado */
        #keyboard {
            width: 100%;
            padding: 10px;
            padding-bottom: 30px;
            background: rgba(0,0,0,0.1);
        }

        .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }

        .key {
            background: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            height: 58px;
            min-width: 32px;
            padding: 0 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            flex: 1;
        }

        .key.wide { flex: 1.5; font-size: 0.8rem; }

        /* Animações e Estados */
        .tile.correct { background: var(--correct); border-color: var(--correct); }
        .tile.present { background: var(--present); border-color: var(--present); }
        .tile.absent { background: var(--absent); border-color: var(--absent); }
        
        .flip { animation: flipTile 0.6s ease-in-out; }
        @keyframes flipTile {
            50% { transform: rotateX(90deg); }
        }

        .shake { animation: shakeRow 0.5s; }
        @keyframes shakeRow {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <header>TERMO</header>

    <div id="menu">
        <button class="btn-mode" onclick="initGame('single')">TERMO</button>
        <button class="btn-mode" onclick="initGame('dueto')">DUETO</button>
        <button class="btn-mode" onclick="initGame('quarteto')">QUARTETO</button>
    </div>

    <div id="game-container"></div>

    <div id="keyboard" style="display: none;">
        <div class="kb-row">
            <button class="key" onclick="pressKey('Q')">Q</button>
            <button class="key" onclick="pressKey('W')">W</button>
            <button class="key" onclick="pressKey('E')">E</button>
            <button class="key" onclick="pressKey('R')">R</button>
            <button class="key" onclick="pressKey('T')">T</button>
            <button class="key" onclick="pressKey('Y')">Y</button>
            <button class="key" onclick="pressKey('U')">U</button>
            <button class="key" onclick="pressKey('I')">I</button>
            <button class="key" onclick="pressKey('O')">O</button>
            <button class="key" onclick="pressKey('P')">P</button>
        </div>
        <div class="kb-row">
            <button class="key" onclick="pressKey('A')">A</button>
            <button class="key" onclick="pressKey('S')">S</button>
            <button class="key" onclick="pressKey('D')">D</button>
            <button class="key" onclick="pressKey('F')">F</button>
            <button class="key" onclick="pressKey('G')">G</button>
            <button class="key" onclick="pressKey('H')">H</button>
            <button class="key" onclick="pressKey('J')">J</button>
            <button class="key" onclick="pressKey('K')">K</button>
            <button class="key" onclick="pressKey('L')">L</button>
        </div>
        <div class="kb-row">
            <button class="key wide" onclick="pressKey('ENTER')">ENTER</button>
            <button class="key" onclick="pressKey('Z')">Z</button>
            <button class="key" onclick="pressKey('X')">X</button>
            <button class="key" onclick="pressKey('C')">C</button>
            <button class="key" onclick="pressKey('V')">V</button>
            <button class="key" onclick="pressKey('B')">B</button>
            <button class="key" onclick="pressKey('N')">N</button>
            <button class="key" onclick="pressKey('M')">M</button>
            <button class="key wide" onclick="pressKey('BACKSPACE')">DEL</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://gist.githubusercontent.com/ro2342/cccb744260bc4528dcfce42a0eb79ac0/raw/cca0ccd62710a4e03dd4da3c96550e780e76a926/wordlist';
        
        let state = {
            targets: [],
            normalized: [],
            currentGuess: "",
            currentTry: 0,
            boardsActive: [],
            gameOver: false,
            mode: ''
        };

        const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

        async function initGame(mode) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('keyboard').style.display = 'block';
            
            const resp = await fetch(API_URL);
            const words = (await resp.text()).split('\n').map(w => w.trim().toUpperCase());
            
            const count = mode === 'single' ? 1 : mode === 'dueto' ? 2 : 4;
            const tries = mode === 'single' ? 6 : mode === 'dueto' ? 7 : 9;
            
            state.mode = mode;
            state.targets = Array.from({length: count}, () => words[Math.floor(Math.random() * words.length)]);
            state.normalized = state.targets.map(norm);
            state.boardsActive = new Array(count).fill(true);
            
            setupBoard(count, tries);
            window.addEventListener('keydown', (e) => pressKey(e.key.toUpperCase()));
        }

        function setupBoard(count, tries) {
            const container = document.getElementById('game-container');
            container.style.gridTemplateColumns = count > 1 ? "1fr 1fr" : "1fr";
            
            for(let i=0; i<count; i++) {
                const b = document.createElement('div');
                b.className = `board b-${i}`;
                for(let t=0; t<tries; t++) {
                    const r = document.createElement('div');
                    r.className = `row r-${t}`;
                    for(let l=0; l<5; l++) {
                        const tile = document.createElement('div');
                        tile.className = "tile";
                        r.appendChild(tile);
                    }
                    b.appendChild(r);
                }
                container.appendChild(b);
            }
        }

        function pressKey(key) {
            if(state.gameOver) return;
            if(key === 'BACKSPACE' || key === 'DELETE') state.currentGuess = state.currentGuess.slice(0, -1);
            else if(key === 'ENTER') submitGuess();
            else if(/^[A-Z]$/.test(key) && state.currentGuess.length < 5) state.currentGuess += key;
            updateDisplay();
        }

        function updateDisplay() {
            state.boardsActive.forEach((active, bIdx) => {
                if(!active) return;
                const row = document.querySelector(`.b-${bIdx} .r-${state.currentTry}`);
                const tiles = row.querySelectorAll('.tile');
                tiles.forEach((t, i) => t.textContent = state.currentGuess[i] || "");
            });
        }

        function submitGuess() {
            if(state.currentGuess.length < 5) return;
            
            let allSolved = true;
            state.targets.forEach((target, i) => {
                if(!state.boardsActive[i]) return;
                
                const result = check(state.currentGuess, state.normalized[i]);
                colorize(i, state.currentTry, result);
                
                if(state.currentGuess === state.normalized[i]) state.boardsActive[i] = false;
                else allSolved = false;
            });

            if(allSolved || state.currentTry >= (state.mode === 'single' ? 5 : state.mode === 'dueto' ? 6 : 8)) {
                state.gameOver = true;
                setTimeout(() => alert("Fim de jogo! Palavras: " + state.targets.join(", ")), 1000);
            }

            state.currentTry++;
            state.currentGuess = "";
        }

        function check(guess, target) {
            const res = new Array(5).fill('absent');
            const tArr = target.split('');
            guess.split('').forEach((l, i) => {
                if(l === tArr[i]) { res[i] = 'correct'; tArr[i] = null; }
            });
            guess.split('').forEach((l, i) => {
                if(res[i] !== 'correct' && tArr.includes(l)) {
                    res[i] = 'present';
                    tArr[tArr.indexOf(l)] = null;
                }
            });
            return res;
        }

        function colorize(bIdx, rIdx, results) {
            const tiles = document.querySelectorAll(`.b-${bIdx} .r-${rIdx} .tile`);
            tiles.forEach((t, i) => {
                setTimeout(() => {
                    t.classList.add('flip');
                    t.classList.add(results[i]);
                }, i * 100);
            });
        }
    </script>
</body>
</html>
