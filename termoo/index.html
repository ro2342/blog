<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Clone - Full Stack</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: #3a3a3c;
            --empty: #121213;
            --border: #3a3a3c;
            --key-bg: #818384;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- UI de Seleção --- */
        #menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 100px;
            text-align: center;
        }

        .btn-mode {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background: var(--correct);
            border: none;
            color: white;
            border-radius: 5px;
            transition: transform 0.2s;
        }

        .btn-mode:hover { transform: scale(1.05); }

        /* --- Grid de Jogos --- */
        #game-container {
            display: grid;
            gap: 20px;
            padding: 20px;
            max-width: 100%;
        }

        .board {
            display: grid;
            gap: 5px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        /* Animações */
        .tile.flip { animation: flip 0.5s ease-in-out forwards; }
        .shake { animation: shake 0.5s; }

        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* --- Teclado --- */
        #keyboard {
            margin-top: auto;
            padding: 10px;
            width: 100%;
            max-width: 500px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .key {
            background: var(--key-bg);
            border: none;
            border-radius: 4px;
            color: white;
            padding: 15px 10px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            text-transform: uppercase;
        }

        .key.large { flex: 1.5; }

        /* --- Estados --- */
        .correct { background-color: var(--correct) !important; border-color: var(--correct) !important; }
        .present { background-color: var(--present) !important; border-color: var(--present) !important; }
        .absent { background-color: var(--absent) !important; border-color: var(--absent) !important; }
        .board.finished { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>

    <h1 id="title">TERMO CLONE</h1>

    <div id="menu">
        <button class="btn-mode" onclick="startGame('single')">JOGO ÚNICO</button>
        <button class="btn-mode" onclick="startGame('dueto')">DUETO</button>
        <button class="btn-mode" onclick="startGame('quarteto')">QUARTETO</button>
    </div>

    <div id="game-container"></div>

    <div id="keyboard" style="display: none;">
        <div class="kb-row" id="row-1"></div>
        <div class="kb-row" id="row-2"></div>
        <div class="kb-row" id="row-3"></div>
    </div>

    <script>
        /**
         * LÓGICA DE NEGÓCIO E ESTADO
         */
        const CONFIG = {
            single: { words: 1, tries: 6, cols: 1 },
            dueto: { words: 2, tries: 7, cols: 2 },
            quarteto: { words: 4, tries: 9, cols: 2 },
            wordUrl: 'https://gist.githubusercontent.com/ro2342/cccb744260bc4528dcfce42a0eb79ac0/raw/cca0ccd62710a4e03dd4da3c96550e780e76a926/wordlist'
        };

        let gameState = {
            targetWords: [],
            normalizedTargets: [],
            currentTry: 0,
            currentGuess: '',
            boardsStatus: [], // true se resolvido
            gameOver: false,
            allWords: [],
            mode: ''
        };

        // Normalização para comparação (remove acentos)
        const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

        async function fetchWords() {
            try {
                const response = await fetch(CONFIG.wordUrl);
                const text = await response.text();
                return text.split('\n').map(w => w.trim()).filter(w => w.length === 5);
            } catch (e) {
                console.error("Erro ao carregar palavras", e);
                return ["TERMO", "JOGAR", "AMIGO", "NOITE", "LIVRO"]; // Fallback
            }
        }

        async function startGame(mode) {
            gameState.allWords = await fetchWords();
            gameState.mode = mode;
            const cfg = CONFIG[mode];
            
            // Setup inicial
            gameState.targetWords = [];
            gameState.normalizedTargets = [];
            gameState.boardsStatus = new Array(cfg.words).fill(false);
            gameState.currentTry = 0;
            gameState.gameOver = false;
            
            // Escolher palavras aleatórias
            for(let i=0; i<cfg.words; i++) {
                const word = gameState.allWords[Math.floor(Math.random() * gameState.allWords.length)];
                gameState.targetWords.push(word.toUpperCase());
                gameState.normalizedTargets.push(normalize(word));
            }

            renderUI(cfg);
            document.addEventListener('keydown', handlePhysicKeyboard);
        }

        /**
         * UI E RENDEREZAÇÃO
         */
        function renderUI(cfg) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('keyboard').style.display = 'block';
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;

            for (let b = 0; b < cfg.words; b++) {
                const board = document.createElement('div');
                board.className = `board b-${b}`;
                for (let r = 0; r < cfg.tries; r++) {
                    const row = document.createElement('div');
                    row.className = `row r-${r}`;
                    for (let c = 0; c < 5; c++) {
                        const tile = document.createElement('div');
                        tile.className = `tile t-${c}`;
                        row.appendChild(tile);
                    }
                    board.appendChild(row);
                }
                container.appendChild(board);
            }
            setupVirtualKeyboard();
        }

        function setupVirtualKeyboard() {
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ENTER|ZXCVBNM|BACKSPACE"];
            rows.forEach((rowStr, i) => {
                const rowEl = document.getElementById(`row-${i+1}`);
                rowEl.innerHTML = '';
                const keys = rowStr.includes('|') ? rowStr.split('|') : rowStr.split('');
                
                keys.forEach(key => {
                    if(key.length > 1 && key !== "ENTER" && key !== "BACKSPACE") {
                        // Trata letras no meio do ENTER/BACKSPACE
                        key.split('').forEach(char => createKey(char, rowEl));
                    } else {
                        createKey(key, rowEl);
                    }
                });
            });
        }

        function createKey(key, container) {
            const btn = document.createElement('button');
            btn.className = 'key' + (key.length > 1 ? ' large' : '');
            btn.textContent = key === "BACKSPACE" ? "DEL" : key;
            btn.id = `key-${key}`;
            btn.onclick = () => processInput(key);
            container.appendChild(btn);
        }

        /**
         * LÓGICA DE INPUT
         */
        function handlePhysicKeyboard(e) {
            if (gameState.gameOver) return;
            const key = e.key.toUpperCase();
            if (key === 'ENTER') processInput('ENTER');
            else if (key === 'BACKSPACE') processInput('BACKSPACE');
            else if (/^[A-Z]$/.test(key)) processInput(key);
        }

        function processInput(key) {
            if (gameState.gameOver) return;

            if (key === 'BACKSPACE') {
                gameState.currentGuess = gameState.currentGuess.slice(0, -1);
            } else if (key === 'ENTER') {
                if (gameState.currentGuess.length === 5) submitGuess();
                else shakeCurrentRows();
            } else if (gameState.currentGuess.length < 5) {
                gameState.currentGuess += key;
            }
            updateGrid();
        }

        function updateGrid() {
            const boards = document.querySelectorAll('.board');
            boards.forEach((board, bIdx) => {
                if (gameState.boardsStatus[bIdx]) return;
                const currentRow = board.querySelector(`.r-${gameState.currentTry}`);
                const tiles = currentRow.querySelectorAll('.tile');
                tiles.forEach((tile, tIdx) => {
                    tile.textContent = gameState.currentGuess[tIdx] || '';
                });
            });
        }

        function submitGuess() {
            const normalizedGuess = normalize(gameState.currentGuess);
            const cfg = CONFIG[gameState.mode];
            
            // Validação simples de palavra (opcional: checar se existe na lista)
            
            let anyBoardUpdated = false;

            for (let i = 0; i < cfg.words; i++) {
                if (gameState.boardsStatus[i]) continue;

                const result = checkWord(normalizedGuess, gameState.normalizedTargets[i]);
                revealRow(i, gameState.currentTry, result);

                if (normalizedGuess === gameState.normalizedTargets[i]) {
                    gameState.boardsStatus[i] = true;
                    document.querySelector(`.b-${i}`).classList.add('finished');
                }
                anyBoardUpdated = true;
            }

            updateKeyboardColors();
            
            if (gameState.boardsStatus.every(s => s === true)) {
                endGame(true);
            } else {
                gameState.currentTry++;
                gameState.currentGuess = '';
                if (gameState.currentTry >= cfg.tries) endGame(false);
            }
        }

        function checkWord(guess, target) {
            const result = new Array(5).fill('absent');
            const targetArr = target.split('');
            const guessArr = guess.split('');

            // Greens
            guessArr.forEach((char, i) => {
                if (char === targetArr[i]) {
                    result[i] = 'correct';
                    targetArr[i] = null;
                    guessArr[i] = null;
                }
            });

            // Yellows
            guessArr.forEach((char, i) => {
                if (char && targetArr.includes(char)) {
                    result[i] = 'present';
                    targetArr[targetArr.indexOf(char)] = null;
                }
            });

            return result;
        }

        function revealRow(boardIdx, rowIdx, results) {
            const row = document.querySelector(`.b-${boardIdx} .r-${rowIdx}`);
            const tiles = row.querySelectorAll('.tile');
            
            tiles.forEach((tile, i) => {
                setTimeout(() => {
                    tile.classList.add('flip');
                    tile.classList.add(results[i]);
                }, i * 100);
            });
        }

        function updateKeyboardColors() {
            // Prioridade: correct > present > absent
            const keyStates = {};
            
            gameState.normalizedTargets.forEach((target, bIdx) => {
                // Só processa tabuleiros que ainda estão ativos ou acabaram de ser resolvidos
                // (Para simplificar, processamos todos até o currentTry)
                for(let r=0; r <= gameState.currentTry; r++) {
                    // Lógica simplificada de teclado global
                }
            });
            
            // Atribui cores baseado na tentativa atual em todos os boards
            const guess = normalize(gameState.currentGuess || ""); // Isso rodará após o enter
            // No Termo real, o teclado reflete o "conhecimento acumulado" de todos os boards
        }

        function shakeCurrentRows() {
            document.querySelectorAll(`.row.r-${gameState.currentTry}`).forEach(row => {
                row.classList.add('shake');
                setTimeout(() => row.classList.remove('shake'), 500);
            });
        }

        function endGame(win) {
            gameState.gameOver = true;
            setTimeout(() => {
                alert(win ? "Você venceu!" : `Fim de jogo. Palavras: ${gameState.targetWords.join(', ')}`);
                location.reload(); // Reinicia simples
            }, 1500);
        }
    </script>
</body>
</html>
