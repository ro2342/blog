<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: A Bússola Mágica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* --- ESTILO GERAL --- */
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* Barra de Vida e Contador */
        .top-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: center;
        }
        .hp-container {
            width: 150px; height: 15px; background: rgba(0,0,0,0.6);
            border: 2px solid #fff; border-radius: 10px; overflow: hidden;
        }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4e50, #f9d423); transition: width 0.2s; }
        
        .enemy-counter {
            background: rgba(0,0,0,0.6); color: #fff; padding: 5px 15px;
            border-radius: 15px; border: 1px solid #aaa; font-weight: bold; font-size: 14px;
        }

        /* Painel de Missão */
        .quest-alert {
            position: absolute; top: 50px; width: 100%; text-align: center;
            color: #ffd700; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-size: 18px; font-weight: bold; opacity: 0; transition: opacity 0.5s;
        }

        /* Joystick e Botões */
        #controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #joystick-area {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3); pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 215, 0, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px black;
        }
        #btn-atk {
            position: absolute; bottom: 50px; right: 40px; width: 90px; height: 90px;
            background: rgba(200, 50, 50, 0.8); border-radius: 50%; border: 4px solid white;
            color: white; font-size: 40px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #btn-atk:active { transform: scale(0.95); background: #ff0000; }

        /* Tela Inicial */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 20, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s; pointer-events: auto;
        }
        h1 { color: #ffd700; margin-bottom: 10px; font-size: 32px; text-transform: uppercase; letter-spacing: 3px; }
        p { color: #ccc; margin-bottom: 30px; }
        button {
            padding: 15px 40px; font-size: 20px; background: #ffd700; border: none;
            color: #000; font-weight: bold; cursor: pointer; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="top-bar">
            <div class="hp-container"><div id="hp-fill"></div></div>
            <div class="enemy-counter" id="enemy-count">Inimigos: --</div>
        </div>
        <div class="quest-alert" id="quest-msg">OBJETIVO ATUALIZADO</div>
    </div>

    <div id="start-screen">
        <h1>Nárnia RPG</h1>
        <p>Siga a Seta Dourada para encontrar inimigos.</p>
        <button onclick="Game.startFirstLevel()">INICIAR AVENTURA</button>
    </div>

    <div id="controls">
        <div id="joystick-area"><div id="joystick-stick"></div></div>
        <div id="btn-atk">⚔️</div>
    </div>

<script>
/* --- ENGINE GRÁFICA SIMPLIFICADA (THREE.JS) --- */

const Colors = {
    sky: 0x87CEEB,
    ground: 0xe0f7fa,
    player: 0x3498db,
    enemy: 0x555555,
    boss: 0x8e44ad,
    gold: 0xffd700
};

class Game {
    static init() {
        // Cena
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(Colors.sky);
        this.scene.fog = new THREE.Fog(Colors.sky, 15, 50);

        // Câmera
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        this.camera.position.set(0, 15, 12);

        // Renderizador
        this.renderer = new THREE.WebGLRenderer({antialias: true});
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        document.body.appendChild(this.renderer.domElement);

        // Luzes
        const amb = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(amb);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        this.scene.add(sun);

        // Loop
        this.clock = new THREE.Clock();
        this.update();
        
        // Resize
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth/window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        this.setupInputs();
    }

    static startFirstLevel() {
        document.getElementById('start-screen').style.opacity = 0;
        setTimeout(()=>document.getElementById('start-screen').style.display='none', 500);
        
        this.levelIndex = 0;
        this.loadLevel(0);
    }

    static loadLevel(idx) {
        if(idx >= LEVELS.length) {
            alert("VOCÊ ZEROU O JOGO!");
            location.reload();
            return;
        }
        
        // Limpeza
        if(this.player) this.scene.remove(this.player.mesh);
        if(this.portal) this.scene.remove(this.portal);
        if(this.enemies) this.enemies.forEach(e => this.scene.remove(e.mesh));
        if(this.scenery) this.scenery.forEach(s => this.scene.remove(s));
        
        // Setup Dados
        const data = LEVELS[idx];
        this.enemies = [];
        this.scenery = [];
        this.portal = null;
        this.levelDone = false;
        
        // Ambiente
        this.scene.background = new THREE.Color(data.sky);
        this.scene.fog = new THREE.Fog(data.sky, 20, 50);
        this.createGround(data.groundColor);
        this.createForest();

        // Player e Inimigos
        this.player = new Player(this.scene);
        for(let i=0; i<data.enemyCount; i++) {
            this.enemies.push(new Enemy(this.scene, false));
        }
        if(data.boss) this.enemies.push(new Enemy(this.scene, true));

        // HUD
        this.updateEnemyCount();
        this.showMsg(data.title);
    }

    static createGround(color) {
        // Chão simples mas eficiente
        const geo = new THREE.PlaneGeometry(100, 100);
        const mat = new THREE.MeshLambertMaterial({color: color});
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI/2;
        mesh.receiveShadow = true;
        this.scene.add(mesh);
        this.scenery.push(mesh);
    }

    static createForest() {
        for(let i=0; i<40; i++) {
            const ang = (i/40)*6.28;
            const r = 35 + Math.random()*5; // Parede invisível visual
            const tree = new THREE.Group();
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 2), new THREE.MeshLambertMaterial({color:0x5d4037}));
            trunk.position.y = 1;
            tree.add(trunk);
            
            const leaf = new THREE.Mesh(new THREE.ConeGeometry(2, 5), new THREE.MeshLambertMaterial({color:0x2e7d32}));
            leaf.position.y = 4;
            tree.add(leaf);

            tree.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
            this.scene.add(tree);
            this.scenery.push(tree);
        }
    }

    static spawnPortal() {
        this.levelDone = true;
        this.showMsg("PORTAL ABERTO! ENTRE NA LUZ!");
        
        const group = new THREE.Group();
        
        // Base
        const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.1), new THREE.MeshBasicMaterial({color: 0xffff00}));
        group.add(base);
        
        // Luz
        const beam = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 20, 8, 1, true), new THREE.MeshBasicMaterial({color: 0xffff00, opacity: 0.3, transparent: true, side: THREE.DoubleSide}));
        beam.position.y = 10;
        group.add(beam);

        group.position.set(0, 0.1, -15); // Sempre ao Norte
        this.scene.add(group);
        this.portal = group;
    }

    static update() {
        requestAnimationFrame(() => this.update());
        const dt = this.clock.getDelta();

        if(!this.player) return;

        // Player Move
        this.player.update(this.input, dt);

        // Camera Follow
        const camTarget = this.player.mesh.position.clone().add(new THREE.Vector3(0, 14, 10));
        this.camera.position.lerp(camTarget, 0.1);
        this.camera.lookAt(this.player.mesh.position);

        // Bússola (Seta)
        let target = null;
        if(this.levelDone && this.portal) {
            target = this.portal.position;
        } else if(this.enemies.length > 0) {
            // Achar inimigo mais perto
            let minDist = 9999;
            this.enemies.forEach(e => {
                const d = this.player.mesh.position.distanceTo(e.mesh.position);
                if(d < minDist) { minDist = d; target = e.mesh.position; }
            });
        }
        
        if(target) {
            this.player.arrow.visible = true;
            this.player.arrow.lookAt(target.x, this.player.mesh.position.y, target.z);
        } else {
            this.player.arrow.visible = false;
        }

        // Inimigos Logic
        this.enemies.forEach(e => e.update(this.player, dt));

        // Portal Check
        if(this.levelDone && this.portal) {
            if(this.player.mesh.position.distanceTo(this.portal.position) < 2) {
                this.levelIndex++;
                this.loadLevel(this.levelIndex);
            }
        }
    }

    static updateEnemyCount() {
        document.getElementById('enemy-count').innerText = `Inimigos: ${this.enemies.length}`;
        if(this.enemies.length === 0 && !this.levelDone) {
            this.spawnPortal();
        }
    }

    static showMsg(text) {
        const el = document.getElementById('quest-msg');
        el.innerText = text;
        el.style.opacity = 1;
        setTimeout(() => el.style.opacity = 0, 4000);
    }

    // --- INPUTS ---
    static setupInputs() {
        this.input = { x: 0, y: 0, atk: false };
        
        // Joystick
        const joy = document.getElementById('joystick-area');
        const stick = document.getElementById('joystick-stick');
        let startX, startY;

        const move = (cx, cy) => {
            const dx = cx - startX, dy = cy - startY;
            const dist = Math.min(Math.sqrt(dx*dx+dy*dy), 40);
            const ang = Math.atan2(dy, dx);
            const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
            stick.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            this.input.x = kx/40; this.input.y = ky/40;
        };

        const end = () => {
            stick.style.transform = `translate(-50%, -50%)`;
            this.input.x = 0; this.input.y = 0;
        };

        joy.addEventListener('touchstart', e=>{e.preventDefault(); startX=e.touches[0].clientX; startY=e.touches[0].clientY;});
        joy.addEventListener('touchmove', e=>{e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY);});
        joy.addEventListener('touchend', end);
        
        // Mouse Support
        joy.addEventListener('mousedown', e=>{e.preventDefault(); startX=e.clientX; startY=e.clientY; this.mouseDown=true;});
        window.addEventListener('mousemove', e=>{if(this.mouseDown) move(e.clientX, e.clientY);});
        window.addEventListener('mouseup', ()=>{if(this.mouseDown){this.mouseDown=false; end();}});

        // Attack Btn
        const btn = document.getElementById('btn-atk');
        const atk = (e) => {
            if(e) e.preventDefault();
            this.player.attack(this.enemies);
        };
        btn.addEventListener('touchstart', atk);
        btn.addEventListener('mousedown', atk);
        window.addEventListener('keydown', e=>{if(e.code==='Space') atk();});
    }
}

class Player {
    constructor(scene) {
        this.mesh = new THREE.Group();
        
        // Visual
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4), new THREE.MeshLambertMaterial({color: Colors.player}));
        body.position.y = 0.7; body.castShadow = true;
        this.mesh.add(body);
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshLambertMaterial({color: 0xffdbac}));
        head.position.y = 1.6;
        this.mesh.add(head);

        // Espada
        this.sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.1), new THREE.MeshStandardMaterial({color: 0xffffff}));
        this.sword.position.set(0.5, 0.8, 0.4);
        this.sword.rotation.x = Math.PI/2;
        this.mesh.add(this.sword);

        // SETA (BÚSSOLA)
        this.arrow = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1, 8), new THREE.MeshBasicMaterial({color: Colors.gold}));
        this.arrow.rotation.x = -Math.PI/2; // Deitada
        this.arrow.position.y = 0.1; // No chão
        this.arrow.position.z = 1.5; // Na frente do player
        // Hack: A seta precisa ser filha direta da cena ou ter um pivot independente para girar livremente
        // Mas para simplificar, vamos colocar um "Pivot" dentro do player
        this.arrowPivot = new THREE.Group();
        this.arrowPivot.add(this.arrow);
        this.mesh.add(this.arrowPivot);
        // Na verdade, a seta deve girar independentemente do player. Vamos ajustar no update.
        this.arrow.visible = false;

        scene.add(this.mesh);
        this.hp = 100;
        this.isAttacking = false;
    }

    update(input, dt) {
        if(Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1) {
            const dir = new THREE.Vector3(input.x, 0, input.y).normalize();
            this.mesh.position.add(dir.multiplyScalar(6 * dt));
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);
            
            // Limite Mapa
            if(this.mesh.position.length() > 33) this.mesh.position.setLength(33);
        }
    }

    attack(enemies) {
        if(this.isAttacking) return;
        this.isAttacking = true;
        
        // Anim Sword
        let f=0;
        const iv = setInterval(()=>{
            f++; this.sword.rotation.y -= 0.6;
            if(f>5) { clearInterval(iv); this.sword.rotation.y = Math.PI/2; this.isAttacking = false; }
        }, 30);

        // Hit Detection
        enemies.forEach((e, i) => {
            const dist = this.mesh.position.distanceTo(e.mesh.position);
            if(dist < 3) {
                // Angle check
                const pDir = new THREE.Vector3(0,0,1).applyQuaternion(this.mesh.quaternion);
                const eDir = e.mesh.position.clone().sub(this.mesh.position).normalize();
                if(pDir.dot(eDir) > 0.3) {
                    if(e.takeDamage()) {
                        // Morreu
                        Game.scene.remove(e.mesh);
                        Game.enemies.splice(i, 1);
                        Game.updateEnemyCount();
                    }
                }
            }
        });
    }
}

class Enemy {
    constructor(scene, isBoss) {
        this.mesh = new THREE.Group();
        this.isBoss = isBoss;
        this.hp = isBoss ? 20 : 3;
        
        const scale = isBoss ? 2 : 1;
        const col = isBoss ? Colors.boss : Colors.enemy;

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5*scale, 0.6*scale, 1.4*scale), new THREE.MeshLambertMaterial({color: col}));
        body.position.y = 0.7*scale; body.castShadow = true;
        this.mesh.add(body);
        
        const hood = new THREE.Mesh(new THREE.ConeGeometry(0.6*scale, 0.8*scale), new THREE.MeshLambertMaterial({color: col}));
        hood.position.y = 1.8*scale;
        this.mesh.add(hood);

        // Random Pos
        const ang = Math.random()*6.28;
        const dst = 10 + Math.random()*15;
        this.mesh.position.set(Math.sin(ang)*dst, 0, Math.cos(ang)*dst);
        
        scene.add(this.mesh);
    }

    update(player, dt) {
        const dist = this.mesh.position.distanceTo(player.mesh.position);
        if(dist < 15 && dist > 1.5) {
            this.mesh.lookAt(player.mesh.position);
            this.mesh.translateZ((this.isBoss?3:2)*dt);
        }
        // Dano simples no player
        if(dist < 1.5 && Math.random() < 0.02) {
            player.hp -= 5;
            document.getElementById('hp-fill').style.width = player.hp + '%';
            if(player.hp <= 0) { alert("Game Over"); location.reload(); }
        }
    }

    takeDamage() {
        this.hp--;
        // Flash Red
        this.mesh.children.forEach(c => c.material.color.setHex(0xff0000));
        setTimeout(() => {
            const col = this.isBoss ? Colors.boss : Colors.enemy;
            this.mesh.children.forEach(c => c.material.color.setHex(col));
        }, 100);
        
        return this.hp <= 0;
    }
}

const LEVELS = [
    { title: "Floresta de Neve", groundColor: 0xe0f7fa, sky: 0x87CEEB, enemyCount: 3, boss: false },
    { title: "Rio Congelado", groundColor: 0xaed6f1, sky: 0xb0e0e6, enemyCount: 5, boss: false },
    { title: "Acampamento Final", groundColor: 0x7cfc00, sky: 0x87CEFA, enemyCount: 0, boss: true }
];

Game.init();

</script>
</body>
</html>
