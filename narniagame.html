<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: Mystery Wardrobe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gb-bg: #c0c0c0;
            --screen-bg: #e0f8cf;
            --screen-dark: #306230;
            --screen-darker: #0f380f;
            --btn-color: #5a0e2d;
            --btn-shadow: #3a081d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove flash azul no toque */
        }

        body {
            background-color: #222;
            margin: 0;
            height: 100dvh; /* Altura dinâmica real do celular */
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
        }

        /* O CONSOLE (Moldura Responsiva) */
        #console {
            background-color: var(--gb-bg);
            width: 100%;
            height: 100%;
            max-width: 450px; /* Limite para não ficar gigante em tablet/PC */
            max-height: 850px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 0;
        }

        /* Arredondar bordas apenas se houver espaço (Desktop/Tablet) */
        @media (min-width: 450px) {
            #console {
                height: 95%;
                border-radius: 30px;
                border-bottom-right-radius: 60px;
            }
        }

        /* TELA DO JOGO */
        #screen-container {
            background-color: #555;
            padding: 10px 10px 25px 10px;
            border-radius: 10px 10px 30px 10px;
            width: 100%;
            flex-shrink: 0; /* Não deixa a tela encolher demais */
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }

        #screen {
            background-color: var(--screen-bg);
            width: 100%;
            aspect-ratio: 9/7; /* Mantém a proporção exata do Grid */
            border: 3px solid var(--screen-darker);
            position: relative;
            image-rendering: pixelated;
        }

        /* GRID */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(7, 1fr);
            width: 100%;
            height: 100%;
        }

        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(12px, 4vw, 24px); /* Tamanho do emoji responsivo */
            position: relative;
        }

        /* Terrenos */
        .wood { background-color: #e0f8cf; color: #8bac0f; border: 1px solid rgba(15, 56, 15, 0.05); }
        .snow { background-color: #f4fff4; color: #306230; opacity: 0.9; }
        .wall { background-color: #0f380f; color: #e0f8cf; border: 1px solid #000; }
        .ice  { background-color: #8bac0f; border: 1px solid #306230; }
        .lamp { background-color: #306230; color: #fff; animation: glow 1s infinite alternate;}
        @keyframes glow { from { opacity: 0.7; } to { opacity: 1; } }

        .player {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        /* UI INFO */
        #ui-bar {
            display: flex;
            justify-content: space-between;
            color: var(--screen-darker);
            font-size: 10px; /* Fonte pequena fixa */
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        #dialog-box {
            background: var(--screen-darker);
            color: var(--screen-bg);
            padding: 5px;
            font-size: 10px; /* Fonte pequena fixa */
            min-height: 40px;
            display: flex;
            align-items: center;
            border-top: 2px solid var(--screen-bg);
            margin-top: -2px; /* Gruda na tela */
        }

        /* ÁREA DE CONTROLES (Preenche o resto da tela) */
        #controls-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Espalha controles verticalmente */
            align-items: center;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .controls-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        /* D-PAD */
        .d-pad {
            position: relative;
            width: 140px;
            height: 140px;
            transform: scale(0.9); /* Ajuste fino */
        }
        .d-btn {
            position: absolute;
            width: 46px;
            height: 46px;
            background: #111;
            border: none;
            box-shadow: 3px 3px 0px #000;
            cursor: pointer;
        }
        .d-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
        
        .up { top: 0; left: 47px; border-radius: 4px 4px 0 0; }
        .down { bottom: 0; left: 47px; border-radius: 0 0 4px 4px; }
        .left { top: 47px; left: 0; border-radius: 4px 0 0 4px; }
        .right { top: 47px; right: 0; border-radius: 0 4px 4px 0; }
        .center { top: 47px; left: 47px; background: #1a1a1a; pointer-events: none; width: 46px; height: 46px;}

        /* BOTOES A/B */
        .ab-btns {
            position: relative;
            width: 120px;
            height: 80px;
        }

        .btn-round {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--btn-color);
            position: absolute;
            border: none;
            box-shadow: 3px 3px 0 var(--btn-shadow);
            color: rgba(255,255,255,0.2);
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-round:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--btn-shadow); }

        .btn-a { top: -10px; right: 0; background: #8b1d46; }
        .btn-b { bottom: 0; left: 10px; background: #5a0e2d; }
        
        .lbl { position: absolute; font-size: 10px; color: #444; font-weight: bold; }
        .lbl-a { top: 45px; right: 10px; }
        .lbl-b { bottom: -15px; left: 20px; }

    </style>
</head>
<body>

    <div id="console">
        <div id="screen-container">
            <div id="ui-bar">
                <span id="p-name">LÚCIA</span>
                <span id="ap-count">AP: 3/3</span>
            </div>
            <div id="screen">
                <div id="game-grid"></div>
            </div>
            <div id="dialog-box">Carregando Nárnia...</div>
        </div>

        <div id="controls-area">
            <div class="controls-row">
                <div class="d-pad">
                    <button class="d-btn up" ontouchstart="input('up'); event.preventDefault()" onclick="input('up')"></button>
                    <button class="d-btn left" ontouchstart="input('left'); event.preventDefault()" onclick="input('left')"></button>
                    <div class="d-btn center"></div>
                    <button class="d-btn right" ontouchstart="input('right'); event.preventDefault()" onclick="input('right')"></button>
                    <button class="d-btn down" ontouchstart="input('down'); event.preventDefault()" onclick="input('down')"></button>
                </div>

                <div class="ab-btns">
                    <button class="btn-round btn-a" ontouchstart="input('interact'); event.preventDefault()" onclick="input('interact')">A</button>
                    <div class="lbl lbl-a">AÇÃO</div>
                    
                    <button class="btn-round btn-b" ontouchstart="input('pass'); event.preventDefault()" onclick="input('pass')">B</button>
                    <div class="lbl lbl-b">PASSAR</div>
                </div>
            </div>
            
            <div style="text-align: center; color: #888; font-size: 8px; margin-top: 10px;">NARNIA POCKET SYSTEM</div>
        </div>
    </div>

<script>
    const COLS = 9;
    const ROWS = 7;
    
    // 0:Madeira, 1:Neve, 2:Parede, 3:Gelo, 9:Lamp
    const players = [
        { name: "Lúcia", skin: "👧", x: 0, y: 3, ap: 3, maxAp: 3 },
        { name: "Edmundo", skin: "👦", x: 0, y: 4, ap: 3, maxAp: 3 }
    ];
    
    let turn = 0;
    let map = [];
    let gameOver = false;

    const gridEl = document.getElementById('game-grid');
    const dialogEl = document.getElementById('dialog-box');
    const pNameEl = document.getElementById('p-name');
    const apEl = document.getElementById('ap-count');

    function init() {
        generateMap();
        renderMap();
        updateUI();
        typeText(`Turno de ${players[turn].name}.`);
    }

    function generateMap() {
        map = [];
        for (let y = 0; y < ROWS; y++) {
            let row = [];
            for (let x = 0; x < COLS; x++) {
                let val = 0; 
                let rand = Math.random();
                if (x > 2 && x < 6) val = rand > 0.6 ? 2 : (rand > 0.4 ? 3 : 0);
                if (x >= 6) val = rand > 0.5 ? 1 : 0;
                if (x === 0 || x === 1) val = 0;
                row.push(val);
            }
            map.push(row);
        }
        map[Math.floor(ROWS/2)][COLS-1] = 9;
    }

    function renderMap() {
        gridEl.innerHTML = '';
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const cell = document.createElement('div');
                cell.className = 'tile';
                const type = map[y][x];
                if (type === 0) cell.classList.add('wood');
                else if (type === 1) { cell.classList.add('snow'); cell.innerHTML = '❄️'; }
                else if (type === 2) { cell.classList.add('wall'); cell.innerHTML = '🧥'; }
                else if (type === 3) { cell.classList.add('ice'); cell.innerHTML = '🧊'; }
                else if (type === 9) { cell.classList.add('lamp'); cell.innerHTML = '🕯️'; }
                gridEl.appendChild(cell);
            }
        }
        players.forEach((p, index) => {
            const pDiv = document.createElement('div');
            pDiv.className = 'player';
            pDiv.innerHTML = p.skin;
            // Cálculo de posição para grid absoluto se necessário, mas aqui usaremos appendChild
            const cellIndex = (p.y * COLS) + p.x;
            const targetCell = gridEl.children[cellIndex];
            if(targetCell) targetCell.appendChild(pDiv);
            if (index !== turn) pDiv.style.opacity = "0.4";
        });
    }

    function input(action) {
        if (gameOver) return;
        const p = players[turn];
        let dx = 0, dy = 0;

        if (action === 'up') dy = -1;
        if (action === 'down') dy = 1;
        if (action === 'left') dx = -1;
        if (action === 'right') dx = 1;
        if (action === 'pass') { switchTurn(); return; }
        if (action === 'interact') { tryInteract(p); return; }

        if (dx !== 0 || dy !== 0) tryMove(p, dx, dy);
    }

    function tryMove(p, dx, dy) {
        const nx = p.x + dx;
        const ny = p.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return shake();

        const tile = map[ny][nx];
        if (tile === 2 || tile === 3) { typeText("Bloqueado! (Botão A)"); return shake(); }

        const otherP = players[turn === 0 ? 1 : 0];
        if (nx === otherP.x && ny === otherP.y) { typeText("Ocupado!"); return shake(); }

        let cost = (tile === 1) ? 2 : 1;
        if (p.ap >= cost) {
            p.x = nx; p.y = ny; p.ap -= cost;
            renderMap(); updateUI();
            if (tile === 9) { gameOver = true; typeText(`VITÓRIA DE ${p.name.toUpperCase()}!`); confetti(); return; }
        } else {
            typeText("Sem AP! Passe a vez (B)."); shake();
        }
    }

    function tryInteract(p) {
        const adj = [{x:p.x+1,y:p.y}, {x:p.x-1,y:p.y}, {x:p.x,y:p.y+1}, {x:p.x,y:p.y-1}];
        let acted = false;
        for (let pos of adj) {
            if (pos.x >= 0 && pos.x < COLS && pos.y >= 0 && pos.y < ROWS) {
                if (map[pos.y][pos.x] === 3 && p.ap >= 1) {
                    map[pos.y][pos.x] = 0; p.ap -= 1;
                    typeText("Quebrou o gelo!"); acted = true;
                    renderMap(); updateUI(); break;
                }
            }
        }
        if (!acted) typeText("Nada para quebrar.");
    }

    function switchTurn() {
        turn = turn === 0 ? 1 : 0;
        players[turn].ap = players[turn].maxAp;
        renderMap(); updateUI();
        typeText(`Vez de ${players[turn].name}!`);
    }

    function updateUI() {
        const p = players[turn];
        pNameEl.innerText = p.name;
        apEl.innerText = `AP: ${p.ap}/${p.maxAp}`;
        apEl.style.color = p.ap === 0 ? '#8b1d46' : '#0f380f';
    }

    function typeText(txt) { dialogEl.innerText = txt; }
    
    function shake() {
        const s = document.getElementById('screen');
        s.style.transform = "translateX(4px)";
        setTimeout(()=>s.style.transform="translateX(-4px)",50);
        setTimeout(()=>s.style.transform="translateX(0)",100);
    }
    
    function confetti() {
        dialogEl.style.background = "gold";
        dialogEl.style.color = "black";
    }

    init();
</script>
</body>
</html>
