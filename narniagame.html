<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: Mystery Wardrobe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gb-bg: #c0c0c0;
            --screen-bg: #e0f8cf; /* Verde GameBoy Clássico */
            --screen-dark: #306230;
            --screen-darker: #0f380f;
            --btn-color: #5a0e2d;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none; /* Previne zoom no celular */
        }

        /* O CONSOLE (Moldura) */
        #console {
            background-color: var(--gb-bg);
            width: 360px;
            height: 640px;
            border-radius: 20px 20px 40px 40px;
            box-shadow: -5px 5px 0px #111;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* A TELA DO JOGO */
        #screen-border {
            background-color: #555;
            padding: 10px 10px 30px 10px;
            border-radius: 10px 10px 30px 10px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }

        #screen {
            background-color: var(--screen-bg);
            height: 280px;
            width: 100%;
            border: 2px solid var(--screen-darker);
            position: relative;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* GRID DO JOGO */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            height: 100%;
        }

        .tile {
            border: 1px solid rgba(15, 56, 15, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            position: relative;
        }

        /* Terrenos */
        .wood { background-color: #e0f8cf; color: #8bac0f; } /* Chão normal */
        .snow { background-color: #ffffff; color: #306230; opacity: 0.8; } /* Neve (lento) */
        .wall { background-color: #0f380f; color: #e0f8cf; } /* Parede */
        .ice  { background-color: #8bac0f; border: 1px solid #306230; } /* Quebrável */
        .lamp { background-color: #306230; color: #fff; animation: glow 1s infinite alternate;}

        @keyframes glow { from { opacity: 0.7; } to { opacity: 1; } }

        /* Jogadores (Sprites Simples) */
        .player {
            position: absolute;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        
        /* UI DE TEXTO (RPG STYLE) */
        #dialog-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--screen-darker);
            color: var(--screen-bg);
            padding: 5px;
            font-size: 10px;
            height: 50px;
            box-sizing: border-box;
            line-height: 1.5;
            border-top: 2px solid var(--screen-bg);
        }

        /* STATUS BAR (Energia) */
        #status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--screen-darker);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* CONTROLES (D-PAD + BOTOES) */
        #controls-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        /* D-PAD */
        .d-pad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .d-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #111;
            cursor: pointer;
            border: none;
            box-shadow: 2px 2px 0 #000;
        }
        .d-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .up { top: 0; left: 40px; border-radius: 5px 5px 0 0; }
        .down { bottom: 0; left: 40px; border-radius: 0 0 5px 5px; }
        .left { top: 40px; left: 0; border-radius: 5px 0 0 5px; }
        .right { top: 40px; right: 0; border-radius: 0 5px 5px 0; }
        .center { top: 40px; left: 40px; background: #1a1a1a; pointer-events: none;}

        /* BOTOES A/B */
        .action-btns {
            width: 100px;
            height: 100px;
            position: relative;
        }
        .btn-round {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--btn-color);
            position: absolute;
            border: none;
            box-shadow: 2px 2px 0 #222;
            color: rgba(255,255,255,0.2);
            font-family: inherit;
            cursor: pointer;
        }
        .btn-round:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-a { top: 10px; right: 0; background: #8b1d46; } /* Ação */
        .btn-b { bottom: 10px; left: 0; background: #5a0e2d; } /* Passar Turno */

        .label {
            position: absolute;
            color: #555;
            font-size: 10px;
            font-weight: bold;
        }
        .lbl-a { top: 60px; right: 10px; }
        .lbl-b { bottom: 0px; left: 10px; }

    </style>
</head>
<body>

    <div id="console">
        <div id="screen-border">
            <div id="status-bar">
                <span id="p-name">LÚCIA</span>
                <span id="ap-count">AP: 3/3</span>
            </div>
            <div id="screen">
                <div id="game-grid">
                    </div>
                <div id="dialog-box">Bem-vindo a Narnia. Chegue ao lampião.</div>
            </div>
            <div style="text-align: center; color: #888; font-size: 8px; margin-top: 5px;">NINTENDO GAME BOY</div>
        </div>

        <div id="controls-area">
            <div class="d-pad">
                <button class="d-btn up" onclick="input('up')"></button>
                <button class="d-btn left" onclick="input('left')"></button>
                <button class="d-btn center"></button>
                <button class="d-btn right" onclick="input('right')"></button>
                <button class="d-btn down" onclick="input('down')"></button>
            </div>
            
            <div class="action-btns">
                <button class="btn-round btn-a" onclick="input('interact')">A</button>
                <div class="label lbl-a">AÇÃO</div>
                <button class="btn-round btn-b" onclick="input('pass')">B</button>
                <div class="label lbl-b">PASSAR</div>
            </div>
        </div>
    </div>

<script>
    // Configurações do Mapa
    const COLS = 9;
    const ROWS = 7; // Ajustado para a tela
    
    // Tipos de Terreno
    // 0: Madeira (1 AP)
    // 1: Neve (2 AP)
    // 2: Parede/Casaco (Indestrutível)
    // 3: Gelo/Obstáculo (Quebrável - Requer Ação)
    // 9: Lampião (Objetivo)
    
    // Jogadores
    const players = [
        { name: "Lúcia", skin: "👧", x: 0, y: 3, ap: 3, maxAp: 3 },
        { name: "Edmundo", skin: "👦", x: 0, y: 4, ap: 3, maxAp: 3 }
    ];
    
    let turn = 0; // 0 ou 1
    let map = [];
    let gameOver = false;

    // Elementos DOM
    const gridEl = document.getElementById('game-grid');
    const dialogEl = document.getElementById('dialog-box');
    const pNameEl = document.getElementById('p-name');
    const apEl = document.getElementById('ap-count');

    function init() {
        generateMap();
        renderMap();
        updateUI();
        typeText(`Turno de ${players[turn].name}. Use as setas!`);
    }

    function generateMap() {
        map = [];
        for (let y = 0; y < ROWS; y++) {
            let row = [];
            for (let x = 0; x < COLS; x++) {
                // Lógica de geração procedural simples
                let val = 0; 
                let rand = Math.random();

                if (x > 2 && x < 6) val = rand > 0.7 ? 2 : (rand > 0.4 ? 3 : 0); // Zona do Guarda Roupa (Obstáculos)
                if (x >= 6) val = rand > 0.5 ? 1 : 0; // Zona da Neve (Lenta)
                
                // Limpar área inicial
                if (x === 0 || x === 1) val = 0;

                row.push(val);
            }
            map.push(row);
        }
        // Colocar Lampião
        map[Math.floor(ROWS/2)][COLS-1] = 9;
    }

    function renderMap() {
        gridEl.innerHTML = '';
        
        // Render Tiles
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const cell = document.createElement('div');
                cell.className = 'tile';
                cell.id = `cell-${x}-${y}`;
                
                const type = map[y][x];
                if (type === 0) { cell.classList.add('wood'); }
                else if (type === 1) { cell.classList.add('snow'); cell.innerHTML = '.'; }
                else if (type === 2) { cell.classList.add('wall'); cell.innerHTML = '🧥'; } // Casaco
                else if (type === 3) { cell.classList.add('ice'); cell.innerHTML = '🧊'; }
                else if (type === 9) { cell.classList.add('lamp'); cell.innerHTML = '🕯️'; }

                gridEl.appendChild(cell);
            }
        }

        // Render Players
        players.forEach((p, index) => {
            const pDiv = document.createElement('div');
            pDiv.className = 'player';
            pDiv.innerHTML = p.skin;
            pDiv.id = `p-${index}`;
            // Posicionamento CSS Grid
            const cell = document.getElementById(`cell-${p.x}-${p.y}`);
            cell.appendChild(pDiv);
            
            // Opacidade para quem não está no turno
            if (index !== turn) pDiv.style.filter = "grayscale(100%) opacity(0.5)";
        });
    }

    function input(action) {
        if (gameOver) return;
        
        const p = players[turn];
        let dx = 0, dy = 0;

        if (action === 'up') dy = -1;
        if (action === 'down') dy = 1;
        if (action === 'left') dx = -1;
        if (action === 'right') dx = 1;

        if (action === 'pass') {
            switchTurn();
            return;
        }

        if (action === 'interact') {
            tryInteract(p);
            return;
        }

        if (dx !== 0 || dy !== 0) {
            tryMove(p, dx, dy);
        }
    }

    function tryMove(p, dx, dy) {
        const nx = p.x + dx;
        const ny = p.y + dy;

        // Limites
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
            shake(); return;
        }

        // Bloqueios
        const tile = map[ny][nx];
        if (tile === 2 || tile === 3) { // Parede ou Gelo
            typeText("Bloqueado! Use 'A' para interagir.");
            shake();
            return;
        }

        // Colisão com outro player
        const otherP = players[turn === 0 ? 1 : 0];
        if (nx === otherP.x && ny === otherP.y) {
            typeText("Tem alguém aí!");
            shake();
            return;
        }

        // Custo de Movimento
        let cost = 1;
        if (tile === 1) cost = 2; // Neve custa 2

        if (p.ap >= cost) {
            p.x = nx;
            p.y = ny;
            p.ap -= cost;
            
            // Animação e Render
            renderMap();
            updateUI();

            // Check Vitória
            if (tile === 9) {
                gameOver = true;
                typeText(`PARABÉNS! ${p.name} chegou a Nárnia!`);
                confettiEffect();
                return;
            }

            if (tile === 1) typeText("Neve funda... (Gasta 2 AP)");
            else typeText("Movendo...");

        } else {
            typeText("Sem energia! Passe o turno (B).");
            shake();
        }
    }

    function tryInteract(p) {
        // Interage com o bloco à frente (direção padrão direita ou adjacentes)
        // Para simplificar: quebra gelo adjacente
        const adjacents = [
            {x: p.x+1, y: p.y}, {x: p.x-1, y: p.y},
            {x: p.x, y: p.y+1}, {x: p.x, y: p.y-1}
        ];

        let acted = false;

        for (let pos of adjacents) {
            if (pos.x >= 0 && pos.x < COLS && pos.y >= 0 && pos.y < ROWS) {
                if (map[pos.y][pos.x] === 3) { // Gelo
                    if (p.ap >= 1) {
                        map[pos.y][pos.x] = 0; // Vira chão
                        p.ap -= 1;
                        typeText("CRACK! Quebrou o gelo!");
                        renderMap();
                        updateUI();
                        acted = true;
                        break; // Só quebra um por vez
                    } else {
                        typeText("Cansado demais para quebrar.");
                    }
                }
            }
        }
        if (!acted && p.ap > 0) typeText("Nada para interagir aqui.");
    }

    function switchTurn() {
        turn = turn === 0 ? 1 : 0;
        players[turn].ap = players[turn].maxAp; // Restaura AP
        renderMap();
        updateUI();
        typeText(`Vez de ${players[turn].name}!`);
    }

    function updateUI() {
        const p = players[turn];
        pNameEl.innerText = p.name;
        apEl.innerText = `AP: ${p.ap}/${p.maxAp}`;
        
        // Mudar cor do texto baseado no AP
        apEl.style.color = p.ap === 0 ? '#8b1d46' : '#0f380f';
    }

    function typeText(text) {
        dialogEl.innerText = text;
    }

    function shake() {
        const scr = document.getElementById('screen');
        scr.style.transform = "translate(2px, 2px)";
        setTimeout(() => scr.style.transform = "translate(-2px, -2px)", 50);
        setTimeout(() => scr.style.transform = "translate(0, 0)", 100);
    }
    
    function confettiEffect() {
        dialogEl.style.backgroundColor = "gold";
        dialogEl.style.color = "black";
    }

    // Start
    init();

</script>
</body>
</html>
