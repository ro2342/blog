<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: Breath of the Wild Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Cinzel', serif; user-select: none; touch-action: none; }
        
        /* UI Estilo Zelda */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .stamina-wheel {
            position: absolute; top: 20px; left: 20px; width: 50px; height: 50px;
            border-radius: 50%; border: 4px solid rgba(0,255,0,0.5);
            background: rgba(0,0,0,0.3);
        }

        .hearts {
            position: absolute; top: 20px; left: 80px; font-size: 24px; color: #ff3333;
            text-shadow: 2px 2px 0 #000;
        }

        #quest-msg {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center; font-weight: bold; font-family: sans-serif;
            opacity: 0; transition: opacity 2s;
        }

        /* Controles Virtuais */
        #controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); pointer-events: auto;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(100, 255, 218, 0.8); border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.6);
        }
        #btn-jump {
            position: absolute; bottom: 60px; right: 40px; width: 80px; height: 80px;
            background: rgba(255, 255, 255, 0.2); border-radius: 50%; border: 2px solid #fff;
            pointer-events: auto; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
        }
        #btn-attack {
            position: absolute; bottom: 160px; right: 40px; width: 60px; height: 60px;
            background: rgba(255, 50, 50, 0.4); border-radius: 50%; border: 2px solid #fff;
            pointer-events: auto; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
        }

        /* Tela de Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #d4af37;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #d4af37;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h1>Gerando Nárnia...</h1>
        <p>Criando montanhas e florestas proceduralmente</p>
        <button onclick="startGame()" style="padding:10px 30px; margin-top:20px; font-size:18px; cursor:pointer;">ACORDAR</button>
    </div>

    <div id="ui-layer">
        <div class="stamina-wheel"></div>
        <div class="hearts">❤❤❤❤❤</div>
        <div id="quest-msg">O Ermo do Lampião</div>
    </div>

    <div id="controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-jump">PULAR</div>
        <div id="btn-attack">⚔️</div>
    </div>

<script>
    // --- ENGINE CONFIG ---
    const WORLD_SIZE = 200; // Tamanho do mundo gerado
    const CHUNK_RES = 60; // Resolução do terreno (quanto maior, mais liso)
    const COLORS = {
        sky: 0x87CEEB,
        grassLight: 0x7cfc00,
        grassDark: 0x3e8e41,
        dirt: 0x8B4513,
        stone: 0x808080,
        fog: 0xcfecec
    };

    let scene, camera, renderer, clock, simplex;
    let player, terrainMesh, grassSystem;
    let input = { x: 0, y: 0 };
    let playerVelocity = new THREE.Vector3();
    let isJumping = false;

    // --- INICIALIZAÇÃO ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(COLORS.sky);
        // Fog para dar sensação de profundidade e esconder o fim do mapa (Estilo Zelda)
        scene.fog = new THREE.FogExp2(COLORS.fog, 0.015);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras suaves
        // Renderização de tons estilo cinema
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8;
        document.body.appendChild(renderer.domElement);

        clock = new THREE.Clock();
        simplex = new SimplexNoise(); // Biblioteca de ruído

        // Iluminação "Breath of the Wild" (Sol forte + Luz ambiente azulada)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        createProceduralTerrain();
        createGrass();
        createScenery(); // Árvores, Pedras
        createPlayer();
        createLampPost(); // O ícone de Nárnia

        setupControls();
        
        window.addEventListener('resize', onWindowResize, false);
    }

    // --- GERAÇÃO DE TERRENO (PROCEDURAL) ---
    function createProceduralTerrain() {
        const geometry = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, CHUNK_RES, CHUNK_RES);
        geometry.rotateX(-Math.PI / 2);

        const positions = geometry.attributes.position.array;
        const colors = [];
        const colorAttribute = new THREE.BufferAttribute(new Float32Array(positions.length), 3);

        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i + 2];
            
            // Matemática para criar montanhas suaves
            // Combinamos várias camadas de ruído (Noise)
            let y = 0;
            y += simplex.noise2D(x * 0.02, z * 0.02) * 4; // Colinas grandes
            y += simplex.noise2D(x * 0.1, z * 0.1) * 1;   // Detalhes pequenos
            
            // Elevar as bordas para criar um vale fechado
            const dist = Math.sqrt(x*x + z*z);
            if(dist > 70) y += (dist - 70) * 0.5;

            positions[i + 1] = y;

            // Pintar o terreno baseado na altura
            const color = new THREE.Color();
            if (y > 15) color.setHex(COLORS.stone); // Topo da montanha
            else if (y > 10) color.setHex(COLORS.dirt); // Encosta
            else color.setHex(COLORS.grassLight); // Vales
            
            // Variação de cor aleatória para parecer grama
            if(y <= 10) color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.05);

            colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.8,
            flatShading: true // Estilo Low Poly bonito
        });

        terrainMesh = new THREE.Mesh(geometry, material);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
    }

    // --- SISTEMA DE GRAMA (INSTANCING) ---
    function createGrass() {
        // Criamos 1 brizna de grama e repetimos ela 5000 vezes sem pesar o processador
        const grassGeo = new THREE.ConeGeometry(0.1, 0.4, 3);
        grassGeo.translate(0, 0.2, 0); // Pivô na base
        const grassMat = new THREE.MeshLambertMaterial({ color: COLORS.grassDark });
        
        const count = 6000;
        const mesh = new THREE.InstancedMesh(grassGeo, grassMat, count);
        mesh.receiveShadow = true;
        mesh.castShadow = true;

        const dummy = new THREE.Object3D();
        let index = 0;

        for(let i=0; i<count; i++) {
            const x = (Math.random() - 0.5) * WORLD_SIZE * 0.8;
            const z = (Math.random() - 0.5) * WORLD_SIZE * 0.8;
            const y = getTerrainHeight(x, z);

            // Só colocar grama se não for muito alto (neve/pedra)
            if (y < 8) {
                dummy.position.set(x, y, z);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.scale.setScalar(0.8 + Math.random() * 0.5);
                dummy.updateMatrix();
                mesh.setMatrix(index++, dummy.matrix);
            }
        }
        mesh.instanceMatrix.needsUpdate = true;
        scene.add(mesh);
        grassSystem = mesh;
    }

    // --- CENÁRIO (ÁRVORES E PEDRAS) ---
    function createScenery() {
        // Árvores estilo Zelda (Pinheiros estilizados)
        for(let i=0; i<40; i++) {
            const x = (Math.random() - 0.5) * WORLD_SIZE * 0.7;
            const z = (Math.random() - 0.5) * WORLD_SIZE * 0.7;
            const y = getTerrainHeight(x, z);
            
            if(y > 10) continue; // Não plantar no topo da montanha

            const tree = new THREE.Group();
            
            // Tronco
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 6), new THREE.MeshStandardMaterial({color: 0x5d4037}));
            trunk.position.y = 1;
            trunk.castShadow = true;
            tree.add(trunk);

            // Folhas (3 camadas)
            const leavesMat = new THREE.MeshStandardMaterial({color: 0x228B22});
            const l1 = new THREE.Mesh(new THREE.ConeGeometry(2, 3, 6), leavesMat); l1.position.y = 3; l1.castShadow = true;
            const l2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.5, 6), leavesMat); l2.position.y = 4.5; l2.castShadow = true;
            
            tree.add(l1); tree.add(l2);
            tree.position.set(x, y, z);
            
            // Escala aleatória
            const s = 1 + Math.random();
            tree.scale.set(s,s,s);
            scene.add(tree);
        }
    }

    function createLampPost() {
        // O famoso Lampião de Nárnia
        const group = new THREE.Group();
        
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 4, 8), new THREE.MeshStandardMaterial({color: 0x111}));
        post.position.y = 2;
        group.add(post);

        const lightCase = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.5), new THREE.MeshStandardMaterial({color: 0x111}));
        lightCase.position.y = 4;
        group.add(lightCase);

        const light = new THREE.PointLight(0xffaa00, 2, 15);
        light.position.set(0, 4, 0);
        group.add(light);
        
        // Brilho visual
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xffaa00}));
        bulb.position.y = 4;
        group.add(bulb);

        // Posicionar num lugar bonito
        const h = getTerrainHeight(5, 5);
        group.position.set(5, h, 5);
        scene.add(group);
    }

    // --- JOGADOR ---
    function createPlayer() {
        player = new THREE.Group();

        // Modelo simplificado do Link/Pevensie
        // Corpo
        const bodyMat = new THREE.MeshStandardMaterial({color: 0x3498db}); // Túnica Azul
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.8), bodyMat);
        body.position.y = 0.4;
        player.add(body);

        // Cabeça
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({color: 0xffdbac}));
        head.position.y = 0.95;
        player.add(head);

        // Capuz/Cabelo (Balança com vento)
        const hair = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.5), new THREE.MeshStandardMaterial({color: 0xDAA520})); // Loiro
        hair.position.y = 1.1;
        hair.rotation.x = -0.2;
        player.add(hair);

        // Espada nas costas
        const sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.05), new THREE.MeshStandardMaterial({color: 0x999}));
        sword.position.set(0, 0.6, -0.25);
        sword.rotation.z = 0.5;
        player.add(sword);

        player.traverse(c => c.castShadow = true);
        scene.add(player);
    }

    // --- FÍSICA E MOVIMENTO ---
    function getTerrainHeight(x, z) {
        // Recalcula a altura exata do terreno naquela posição (mesma fórmula da geração)
        let y = 0;
        y += simplex.noise2D(x * 0.02, z * 0.02) * 4;
        y += simplex.noise2D(x * 0.1, z * 0.1) * 1;
        const dist = Math.sqrt(x*x + z*z);
        if(dist > 70) y += (dist - 70) * 0.5;
        return y;
    }

    function animate() {
        requestAnimationFrame(animate);
        
        const dt = clock.getDelta();
        const time = clock.getElapsedTime();

        // 1. Movimento do Jogador
        if (input.x !== 0 || input.y !== 0) {
            // Direção da câmera
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            camDir.y = 0;
            camDir.normalize();
            
            const camSide = new THREE.Vector3();
            camSide.crossVectors(camera.up, camDir).normalize();

            // Vetor de movimento relativo à câmera
            const moveVec = new THREE.Vector3();
            moveVec.add(camSide.multiplyScalar(input.x));
            moveVec.add(camDir.multiplyScalar(-input.y));
            moveVec.normalize();

            player.position.add(moveVec.multiplyScalar(6 * dt)); // Velocidade 6
            
            // Girar personagem para onde anda
            const angle = Math.atan2(moveVec.x, moveVec.z);
            player.rotation.y = angle;
        }

        // 2. Física de Terreno (Gravity & Collision)
        const groundHeight = getTerrainHeight(player.position.x, player.position.z);
        
        if (player.position.y < groundHeight) {
            player.position.y = groundHeight;
            playerVelocity.y = 0;
            isJumping = false;
        } else {
            playerVelocity.y -= 20 * dt; // Gravidade
            player.position.y += playerVelocity.y * dt;
            if(player.position.y < groundHeight) player.position.y = groundHeight;
        }

        // 3. Câmera (Third Person - Breath of the Wild style)
        // A câmera segue o jogador com suavidade (Lerp) e fica um pouco elevada
        const targetCamPos = player.position.clone().add(new THREE.Vector3(0, 3, 6)); // Atrás e acima
        camera.position.lerp(targetCamPos, 0.1); // Suavização
        camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0))); // Olha para cabeça

        // 4. Animação da Grama (Vento)
        // Truque: Movemos a posição dos vértices no shader ou rotacionamos levemente
        // Como é InstancedMesh, vamos simplificar rotacionando o grupo todo levemente
        // Para uma animação real de shader precisaríamos de shaderMaterial customizado (complexo para um arquivo)
        
        renderer.render(scene, camera);
    }

    // --- CONTROLES ---
    function setupControls() {
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        const btnJump = document.getElementById('btn-jump');

        let startX, startY;

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, {passive: false});

        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            const x = e.touches[0].clientX - startX;
            const y = e.touches[0].clientY - startY;
            const dist = Math.min(Math.sqrt(x*x+y*y), 40);
            const angle = Math.atan2(y, x);
            
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            
            joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            
            input.x = kx / 40;
            input.y = ky / 40;
        }, {passive: false});

        const resetJoy = () => {
            joyKnob.style.transform = `translate(-50%, -50%)`;
            input.x = 0; input.y = 0;
        };

        joyZone.addEventListener('touchend', resetJoy);
        
        // Pulo
        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(!isJumping) {
                playerVelocity.y = 8; // Força do pulo
                isJumping = true;
            }
        });

        // Mouse (PC Debug)
        let mouseDown = false;
        joyZone.addEventListener('mousedown', e => { mouseDown=true; startX=e.clientX; startY=e.clientY; });
        window.addEventListener('mousemove', e => {
            if(mouseDown) {
                const x = e.clientX - startX; const y = e.clientY - startY;
                const dist = Math.min(Math.sqrt(x*x+y*y), 40);
                const angle = Math.atan2(y, x);
                input.x = (Math.cos(angle)*dist)/40; input.y = (Math.sin(angle)*dist)/40;
                joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
            }
        });
        window.addEventListener('mouseup', () => { mouseDown=false; resetJoy(); });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function startGame() {
        document.getElementById('loader').style.display = 'none';
        init();
        animate();
        setTimeout(() => {
            document.getElementById('quest-msg').style.opacity = 1;
            setTimeout(() => document.getElementById('quest-msg').style.opacity = 0, 4000);
        }, 1000);
    }

</script>
</body>
</html>
