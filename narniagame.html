<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: Aventura Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* UI SUPERIOR */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .quest-box {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 15px;
            color: #ffd700; font-weight: bold; font-size: 14px; text-align: center;
            border: 2px solid #8b5a2b; width: 85%;
            text-shadow: 1px 1px 0 #000;
        }

        .health-box {
            position: absolute; top: 60px; left: 20px;
            color: #ff4444; font-weight: bold; font-size: 18px;
            text-shadow: 2px 2px 0 black;
            background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;
        }

        /* MODAL DE HISTÓRIA */
        #story-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; padding: 20px; box-sizing: border-box;
        }
        #story-content {
            background: #fdf5e6; color: #2c1b0e; padding: 25px;
            border-radius: 10px; border: 4px solid #8b5a2b;
            max-width: 500px; text-align: center;
            box-shadow: 0 0 30px #ffd700;
        }
        .btn-next {
            background: #27ae60; color: white; border: none; padding: 15px 30px;
            font-size: 20px; border-radius: 50px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 4px 0 #1e8449;
        }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }

        /* CONTROLES VISÍVEIS */
        #controls-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
        
        /* O Círculo do Joystick (Fundo) */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 30px; 
            width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.2); /* Mais visível */
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.5);
            pointer-events: auto; /* Permite toque */
        }
        
        /* O "Pino" do Joystick (Que mexe) */
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; 
            width: 60px; height: 60px;
            background: rgba(255, 215, 0, 0.8); /* Dourado Narnia */
            border-radius: 50%; 
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Botão de Ataque */
        #btn-attack {
            position: absolute; bottom: 50px; right: 30px; 
            width: 90px; height: 90px;
            background: rgba(231, 76, 60, 0.8); 
            border-radius: 50%; 
            border: 4px solid white;
            color: white; font-size: 40px; 
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #btn-attack:active { transform: scale(0.95); background: red; }

    </style>
</head>
<body>

    <div id="story-modal">
        <div id="story-content">
            <h2 id="story-title" style="margin:0 0 10px 0;">Carregando...</h2>
            <p id="story-text" style="font-size:16px; line-height:1.4;">...</p>
            <p id="quest-preview" style="color:#d35400; font-weight:bold;"></p>
            <button class="btn-next" onclick="startGame()">JOGAR AGORA</button>
        </div>
    </div>

    <div id="ui-layer">
        <div class="quest-box" id="quest-text">Objetivo</div>
        <div class="health-box">❤ <span id="hp-display">100</span></div>
    </div>

    <div id="controls-layer">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-attack">⚔️</div>
    </div>

<script>
    // --- CONFIGURAÇÃO DAS FASES ---
    const LEVELS = [
        {
            title: "Capítulo 1: O Inverno Eterno",
            story: "Você encontrou Nárnia! Mas o Sr. Tumnus foi levado. A floresta está cheia de espiões.",
            objective: "Derrote 3 Guardas para abrir o Portal.",
            sky: 0x87CEEB, ground: 0xe0f7fa, enemies: 3, boss: false
        },
        {
            title: "Capítulo 2: Degelo na Represa",
            story: "O gelo está a quebrar! Os lobos da Polícia Secreta cercaram a represa dos castores.",
            objective: "Sobreviva a 5 Lobos da Feiticeira.",
            sky: 0xb0e0e6, ground: 0xafeeee, enemies: 5, boss: false
        },
        {
            title: "Capítulo 3: A Batalha Final",
            story: "A Mesa de Pedra. O exército de Aslam aguarda. O Capitão da Feiticeira desafia-te.",
            objective: "DERROTE O CAPITÃO ANÃO!",
            sky: 0x87CEFA, ground: 0x7cfc00, enemies: 0, boss: true
        }
    ];

    let scene, camera, renderer, clock, player, sword, portal;
    let enemiesArr = [], sceneryArr = [];
    let currentLevel = 0, hp = 100, kills = 0, levelDone = false;
    let input = { x: 0, y: 0, attack: false };

    // --- INICIALIZAR ---
    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 16, 16); // Câmera bem alta
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        clock = new THREE.Clock();
        
        // Luzes
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(10, 20, 10);
        dir.castShadow = true;
        scene.add(dir);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setupControls(); // Configura Joystick e Botão
        loadLevel(0);    // Carrega primeira fase
        animate();       // Começa loop
    }

    // --- CARREGAR FASE ---
    function loadLevel(idx) {
        if(idx >= LEVELS.length) {
            alert("PARABÉNS! NÁRNIA ESTÁ LIVRE!");
            location.reload(); return;
        }
        currentLevel = idx;
        const data = LEVELS[idx];

        // UI
        document.getElementById('story-modal').style.display = 'flex';
        document.getElementById('story-title').innerText = data.title;
        document.getElementById('story-text').innerText = data.story;
        document.getElementById('quest-preview').innerText = "Missão: " + data.objective;
        document.getElementById('quest-text').innerText = data.objective;

        // Reset
        enemiesArr.forEach(e => scene.remove(e));
        sceneryArr.forEach(s => scene.remove(s));
        if(portal) scene.remove(portal);
        if(player) scene.remove(player);
        enemiesArr = []; sceneryArr = []; levelDone = false; kills = 0;

        // Ambiente
        scene.background = new THREE.Color(data.sky);
        scene.fog = new THREE.Fog(data.sky, 20, 50);

        // Chão e Muros
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({color: data.ground}));
        ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
        scene.add(ground); sceneryArr.push(ground);
        createForest();

        // Player
        createPlayer();

        // Inimigos
        for(let i=0; i<data.enemies; i++) spawnEnemy(false);
        if(data.boss) spawnEnemy(true);
    }

    function startGame() {
        document.getElementById('story-modal').style.display = 'none';
    }

    // --- CRIAÇÃO ---
    function createPlayer() {
        const grp = new THREE.Group();
        // Corpo
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.5), new THREE.MeshLambertMaterial({color: 0x3498db}));
        body.position.y = 0.75; body.castShadow = true;
        grp.add(body);
        // Cabeça
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshLambertMaterial({color: 0xffdbac}));
        head.position.y = 1.7;
        grp.add(head);
        // Espada
        sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.6, 0.1), new THREE.MeshStandardMaterial({color:0xffffff}));
        sword.position.set(0.6, 1, 0.5); sword.rotation.x = Math.PI/2;
        grp.add(sword);
        
        scene.add(grp);
        player = grp;
    }

    function spawnEnemy(boss) {
        const grp = new THREE.Group();
        const color = boss ? 0xc0392b : 0x555555;
        const scale = boss ? 2.5 : 1;
        
        const mat = new THREE.MeshLambertMaterial({color: color});
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5*scale, 0.6*scale, 1.5*scale), mat);
        body.position.y = 0.75*scale; body.castShadow = true;
        grp.add(body);

        // Capuz
        const hood = new THREE.Mesh(new THREE.ConeGeometry(0.6*scale, 0.8*scale), mat);
        hood.position.y = 1.9*scale;
        grp.add(hood);

        // Posição
        const ang = Math.random()*6.28;
        const dst = 10 + Math.random()*15;
        grp.position.set(Math.sin(ang)*dst, 0, Math.cos(ang)*dst);
        
        grp.userData = { hp: boss ? 20 : 3, boss: boss };
        scene.add(grp); enemiesArr.push(grp);
    }

    function createForest() {
        for(let i=0; i<40; i++) {
            const ang = (i/40)*6.28;
            const r = 35 + Math.random()*5;
            const grp = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 2), new THREE.MeshLambertMaterial({color:0x5d4037}));
            trunk.position.y = 1;
            const leaf = new THREE.Mesh(new THREE.ConeGeometry(3, 6), new THREE.MeshLambertMaterial({color:0x2e7d32}));
            leaf.position.y = 4;
            grp.add(trunk); grp.add(leaf);
            grp.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
            scene.add(grp); sceneryArr.push(grp);
        }
    }

    function spawnPortal() {
        levelDone = true;
        const geo = new THREE.CylinderGeometry(2, 2, 0.2, 16);
        const mat = new THREE.MeshBasicMaterial({color: 0xffff00, opacity:0.6, transparent:true});
        portal = new THREE.Mesh(geo, mat);
        portal.position.set(0, 0.1, -10);
        
        // Luz
        const beam = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 20, 8, 1, true), new THREE.MeshBasicMaterial({color: 0xffff00, opacity:0.2, transparent:true, side:THREE.DoubleSide}));
        beam.position.y = 10;
        portal.add(beam);
        
        scene.add(portal);
        document.getElementById('quest-text').innerText = "ENTRE NA LUZ PARA AVANÇAR!";
        document.getElementById('quest-text').style.color = "#00ff00";
    }

    // --- CONTROLES (JOYSTICK + RATO + TOQUE) ---
    function setupControls() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const atkBtn = document.getElementById('btn-attack');
        
        let startX, startY;
        let active = false;

        // Funções para lidar com o movimento
        const handleStart = (x, y) => {
            active = true;
            startX = x; startY = y;
        };
        const handleMove = (x, y) => {
            if(!active) return;
            const dx = x - startX;
            const dy = y - startY;
            const dist = Math.min(Math.sqrt(dx*dx+dy*dy), 35); // Raio limite
            const ang = Math.atan2(dy, dx);
            
            const kx = Math.cos(ang)*dist;
            const ky = Math.sin(ang)*dist;
            
            knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            input.x = kx / 35; 
            input.y = ky / 35;
        };
        const handleEnd = () => {
            active = false;
            input.x = 0; input.y = 0;
            knob.style.transform = `translate(-50%, -50%)`;
        };

        // EVENTOS TOQUE
        zone.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY); });
        zone.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        zone.addEventListener('touchend', handleEnd);

        // EVENTOS RATO (Para PC)
        zone.addEventListener('mousedown', e => { e.preventDefault(); handleStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if(active) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', handleEnd);

        // ATAQUE
        const doAttack = (e) => {
            if(e) e.preventDefault();
            if(input.attack) return;
            input.attack = true;
            
            // Animação Espada
            let f = 0;
            const anim = setInterval(() => {
                f++; sword.rotation.y -= 0.6;
                if(f>4) { clearInterval(anim); sword.rotation.y = Math.PI/2; input.attack = false; }
            }, 30);

            // Dano
            enemiesArr.forEach(en => {
                if(player.position.distanceTo(en.position) < 3.5) {
                    // Direção
                    const dir = new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion);
                    const toEn = en.position.clone().sub(player.position).normalize();
                    if(dir.dot(toEn) > 0.4) {
                        en.userData.hp--;
                        en.children.forEach(c => c.material.color.setHex(0xff0000));
                        setTimeout(() => { 
                            if(enemiesArr.includes(en)) en.children.forEach(c => c.material.color.setHex(en.userData.boss?0xc0392b:0x555555)); 
                        }, 100);

                        if(en.userData.hp <= 0) {
                            scene.remove(en);
                            enemiesArr = enemiesArr.filter(x => x!==en);
                            kills++;
                            checkProgress();
                        }
                    }
                }
            });
        };

        atkBtn.addEventListener('touchstart', doAttack);
        atkBtn.addEventListener('mousedown', doAttack);
        // Tecla Espaço também ataca
        window.addEventListener('keydown', e => { if(e.code==='Space') doAttack(); });
    }

    function checkProgress() {
        const data = LEVELS[currentLevel];
        if(!levelDone) {
            if(data.boss) { if(enemiesArr.length===0) spawnPortal(); }
            else { if(kills >= data.enemies) spawnPortal(); }
        }
    }

    // --- LOOP PRINCIPAL ---
    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        if(player) {
            // Mover Player
            if(Math.abs(input.x)>0.1 || Math.abs(input.y)>0.1) {
                const spd = 6 * dt;
                const vec = new THREE.Vector3(input.x, 0, input.y).normalize();
                player.position.add(vec.multiplyScalar(spd));
                // Girar
                player.rotation.y = Math.atan2(vec.x, vec.z);
                // Limite Mapa
                if(player.position.length()>33) player.position.setLength(33);
            }

            // Câmera segue
            const camPos = player.position.clone().add(new THREE.Vector3(0, 14, 12));
            camera.position.lerp(camPos, 0.1);
            camera.lookAt(player.position);

            // Mover Inimigos
            enemiesArr.forEach(en => {
                const dist = en.position.distanceTo(player.position);
                if(dist < 15 && dist > 1.3) {
                    en.lookAt(player.position);
                    en.translateZ(2.5 * dt);
                }
                if(dist < 1.3) {
                    if(Math.random()<0.03) {
                        hp -= 2;
                        document.getElementById('hp-display').innerText = hp;
                        if(hp<=0) { alert("GAME OVER"); location.reload(); }
                    }
                }
            });

            // Portal
            if(levelDone && portal) {
                portal.rotation.y += dt;
                if(player.position.distanceTo(portal.position) < 2) {
                    loadLevel(currentLevel+1);
                }
            }
        }
        renderer.render(scene, camera);
    }

    init();

</script>
</body>
</html>
