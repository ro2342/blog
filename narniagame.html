<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicles of Narnia - 3D Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #FFD700;
        }
        
        #loading h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,215,0,0.3);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading">
        <h1>Loading Narnia...</h1>
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 16px; color: #AAA;">This may take a moment</p>
    </div>
    <div id="root"></div>

    <!-- React and dependencies from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@react-three/fiber@8.15.12/dist/index.umd.js"></script>
    <script src="https://unpkg.com/@react-three/drei@9.92.7/dist/index.umd.js"></script>
    <script src="https://unpkg.com/zustand@4.4.7/esm/index.mjs" type="module"></script>
    
    <script type="text/babel" data-type="module">
        import { create } from 'https://unpkg.com/zustand@4.4.7/esm/index.mjs';
        
        const { Canvas, useFrame, useThree } = window.ReactThreeFiber;
        const { 
            PerspectiveCamera, 
            useKeyboardControls, 
            KeyboardControls,
            Text,
            Sky
        } = window.DreiExports;
        
        // Hide loading screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
        });

        // ==================== ZUSTAND STORE ====================
        const useGameStore = create((set, get) => ({
            currentLevel: 0,
            inventory: [],
            playerHealth: 100,
            isDialogueOpen: false,
            currentDialogue: null,
            dialogueText: '',
            dialogueIndex: 0,
            gameState: 'MENU',
            playerPosition: [0, 0, 0],
            enemies: [],
            
            setLevel: (level) => set({ currentLevel: level }),
            addItem: (item) => set((state) => ({ inventory: [...state.inventory, item] })),
            takeDamage: (amount) => set((state) => {
                const newHealth = Math.max(0, state.playerHealth - amount);
                if (newHealth === 0) {
                    return { playerHealth: 0, gameState: 'GAMEOVER' };
                }
                return { playerHealth: newHealth };
            }),
            openDialogue: (dialogue) => set({ 
                isDialogueOpen: true, 
                currentDialogue: dialogue,
                dialogueText: '',
                dialogueIndex: 0
            }),
            closeDialogue: () => set({ 
                isDialogueOpen: false, 
                currentDialogue: null,
                dialogueText: '',
                dialogueIndex: 0
            }),
            setGameState: (state) => set({ gameState: state }),
            setPlayerPosition: (pos) => set({ playerPosition: pos }),
            updateDialogueText: (text, index) => set({ dialogueText: text, dialogueIndex: index }),
            addEnemy: (enemy) => set((state) => ({ enemies: [...state.enemies, enemy] })),
            removeEnemy: (id) => set((state) => ({ 
                enemies: state.enemies.filter(e => e.id !== id) 
            })),
            resetGame: () => set({
                currentLevel: 0,
                inventory: [],
                playerHealth: 100,
                isDialogueOpen: false,
                currentDialogue: null,
                dialogueText: '',
                dialogueIndex: 0,
                gameState: 'MENU',
                playerPosition: [0, 0, 0],
                enemies: []
            })
        }));

        // ==================== DIALOGUE DATA ====================
        const DIALOGUE_DATA = {
            tumnus: {
                id: 'tumnus',
                name: 'Mr. Tumnus',
                lines: [
                    "Good evening! How delightful to meet you!",
                    "I am a Faun. My name is Tumnus.",
                    "Welcome to Narnia, though these are dark times...",
                    "The White Witch has made it always winter.",
                    "You must be careful, her spies are everywhere!"
                ]
            },
            beaver: {
                id: 'beaver',
                name: 'Mr. Beaver',
                lines: [
                    "Quick! Before the wolves spot you!",
                    "The White Witch's Secret Police are everywhere.",
                    "But there's hope - Aslan is on the move!",
                    "When he appears, everything will change."
                ]
            },
            aslan: {
                id: 'aslan',
                name: 'Aslan',
                lines: [
                    "Welcome, child. Do not be afraid.",
                    "The long winter is ending. Spring is coming.",
                    "You have been brave. Your journey has begun.",
                    "Go forth with courage. Narnia needs you."
                ]
            }
        };

        // ==================== PLAYER ====================
        const Player = ({ position, onPositionChange }) => {
            const meshRef = React.useRef();
            const velocity = React.useRef([0, 0, 0]);
            const { currentLevel, isDialogueOpen, gameState } = useGameStore();
            const [, get] = useKeyboardControls();
            
            const speed = 0.08;
            const friction = 0.85;
            
            useFrame(() => {
                if (!meshRef.current || gameState !== 'PLAYING' || isDialogueOpen) return;
                
                const { forward, backward, left, right } = get();
                
                if (forward) velocity.current[2] -= speed;
                if (backward) velocity.current[2] += speed;
                if (left) velocity.current[0] -= speed;
                if (right) velocity.current[0] += speed;
                
                velocity.current[0] *= friction;
                velocity.current[2] *= friction;
                
                meshRef.current.position.x += velocity.current[0];
                meshRef.current.position.z += velocity.current[2];
                
                const bounds = { min: -20, max: 20 };
                meshRef.current.position.x = Math.max(bounds.min, Math.min(bounds.max, meshRef.current.position.x));
                meshRef.current.position.z = Math.max(bounds.min, Math.min(bounds.max, meshRef.current.position.z));
                
                if (Math.abs(velocity.current[0]) > 0.01 || Math.abs(velocity.current[2]) > 0.01) {
                    const angle = Math.atan2(velocity.current[0], velocity.current[2]);
                    meshRef.current.rotation.y = angle;
                }
                
                onPositionChange([
                    meshRef.current.position.x,
                    meshRef.current.position.y,
                    meshRef.current.position.z
                ]);
            });
            
            return React.createElement('group', { ref: meshRef, position: position },
                React.createElement('mesh', { castShadow: true, position: [0, 0.5, 0] },
                    React.createElement('capsuleGeometry', { args: [0.3, 0.6, 8, 16] }),
                    React.createElement('meshStandardMaterial', { color: "#8B4513" })
                ),
                React.createElement('mesh', { position: [0, 0.5, 0.4], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.15, 16, 16] }),
                    React.createElement('meshStandardMaterial', { 
                        color: "#FFA500", 
                        emissive: "#FF8C00", 
                        emissiveIntensity: 0.5 
                    })
                ),
                React.createElement('mesh', { position: [0, 1.2, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.25, 16, 16] }),
                    React.createElement('meshStandardMaterial', { color: "#FFE4C4" })
                )
            );
        };

        // ==================== CAMERA CONTROLLER ====================
        const CameraController = ({ target }) => {
            const { camera } = useThree();
            const offset = React.useRef(new THREE.Vector3(0, 5, 8));
            
            useFrame(() => {
                const targetPos = new THREE.Vector3(target[0], target[1], target[2]);
                const desiredPos = targetPos.clone().add(offset.current);
                camera.position.lerp(desiredPos, 0.1);
                const lookTarget = targetPos.clone();
                lookTarget.y += 1;
                camera.lookAt(lookTarget);
            });
            
            return null;
        };

        // ==================== SNOW PARTICLES ====================
        const SnowParticles = ({ count = 1000 }) => {
            const points = React.useRef();
            
            const particles = React.useMemo(() => {
                const positions = new Float32Array(count * 3);
                const velocities = [];
                
                for (let i = 0; i < count; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 50;
                    positions[i * 3 + 1] = Math.random() * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                    velocities.push(Math.random() * 0.02 + 0.01);
                }
                
                return { positions, velocities };
            }, [count]);
            
            useFrame(() => {
                if (!points.current) return;
                const positions = points.current.geometry.attributes.position.array;
                
                for (let i = 0; i < count; i++) {
                    positions[i * 3 + 1] -= particles.velocities[i];
                    if (positions[i * 3 + 1] < 0) {
                        positions[i * 3 + 1] = 20;
                        positions[i * 3] = (Math.random() - 0.5) * 50;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                    }
                }
                points.current.geometry.attributes.position.needsUpdate = true;
            });
            
            return React.createElement('points', { ref: points },
                React.createElement('bufferGeometry', null,
                    React.createElement('bufferAttribute', {
                        attach: "attributes-position",
                        count: count,
                        array: particles.positions,
                        itemSize: 3
                    })
                ),
                React.createElement('pointsMaterial', {
                    size: 0.1,
                    color: "#FFFFFF",
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true
                })
            );
        };

        // ==================== LAMP POST ====================
        const LampPost = ({ position }) => {
            return React.createElement('group', { position: position },
                React.createElement('mesh', { castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.15, 0.15, 4, 8] }),
                    React.createElement('meshStandardMaterial', { 
                        color: "#2C2C2C", 
                        metalness: 0.8, 
                        roughness: 0.2 
                    })
                ),
                React.createElement('mesh', { position: [0, 2.5, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.4, 16, 16] }),
                    React.createElement('meshStandardMaterial', { 
                        color: "#FFD700",
                        emissive: "#FFD700",
                        emissiveIntensity: 2,
                        toneMapped: false
                    })
                ),
                React.createElement('pointLight', { 
                    position: [0, 2.5, 0], 
                    color: "#FFD700", 
                    intensity: 10, 
                    distance: 15, 
                    castShadow: true 
                })
            );
        };

        // ==================== NPC ====================
        const NPC = ({ position, npcId, playerPosition, name = "NPC" }) => {
            const meshRef = React.useRef();
            const { openDialogue, isDialogueOpen, currentDialogue } = useGameStore();
            const [isNearby, setIsNearby] = React.useState(false);
            
            useFrame(() => {
                if (!meshRef.current) return;
                const dist = Math.sqrt(
                    Math.pow(playerPosition[0] - position[0], 2) +
                    Math.pow(playerPosition[2] - position[2], 2)
                );
                setIsNearby(dist < 2.5);
            });
            
            React.useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === 'e' || e.key === 'E') {
                        if (isNearby && !isDialogueOpen && DIALOGUE_DATA[npcId]) {
                            openDialogue(DIALOGUE_DATA[npcId]);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isNearby, isDialogueOpen, npcId, openDialogue]);
            
            const isTalking = currentDialogue?.id === npcId;
            
            return React.createElement('group', { ref: meshRef, position: position },
                React.createElement('mesh', { castShadow: true, position: [0, 1, 0] },
                    React.createElement('capsuleGeometry', { args: [0.3, 0.8, 8, 16] }),
                    React.createElement('meshStandardMaterial', { color: "#8B7355" })
                ),
                React.createElement('mesh', { castShadow: true, position: [0, 1.8, 0] },
                    React.createElement('sphereGeometry', { args: [0.3, 16, 16] }),
                    React.createElement('meshStandardMaterial', { color: "#D2B48C" })
                ),
                isNearby && !isDialogueOpen && React.createElement(Text, {
                    position: [0, 2.5, 0],
                    fontSize: 0.3,
                    color: "#FFD700",
                    anchorX: "center",
                    anchorY: "middle",
                    outlineWidth: 0.05,
                    outlineColor: "#000000"
                }, "Press E"),
                isNearby && React.createElement(Text, {
                    position: [0, 2.8, 0],
                    fontSize: 0.2,
                    color: "#FFFFFF",
                    anchorX: "center",
                    anchorY: "middle",
                    outlineWidth: 0.03,
                    outlineColor: "#000000"
                }, name)
            );
        };

        // ==================== WARDROBE ====================
        const Wardrobe = ({ position, playerPosition }) => {
            const [isNearby, setIsNearby] = React.useState(false);
            const { setLevel, setGameState } = useGameStore();
            
            useFrame(() => {
                const dist = Math.sqrt(
                    Math.pow(playerPosition[0] - position[0], 2) +
                    Math.pow(playerPosition[2] - position[2], 2)
                );
                setIsNearby(dist < 1.5);
            });
            
            React.useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === 'e' || e.key === 'E') {
                        if (isNearby) {
                            setGameState('CUTSCENE');
                            setTimeout(() => {
                                setLevel(1);
                                setGameState('PLAYING');
                            }, 2000);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isNearby, setLevel, setGameState]);
            
            return React.createElement('group', { position: position },
                React.createElement('mesh', { castShadow: true, receiveShadow: true },
                    React.createElement('boxGeometry', { args: [2, 3, 1] }),
                    React.createElement('meshStandardMaterial', { color: "#3E2723", roughness: 0.8 })
                ),
                isNearby && React.createElement(Text, {
                    position: [0, 2, 0.6],
                    fontSize: 0.3,
                    color: "#87CEEB",
                    anchorX: "center",
                    anchorY: "middle",
                    outlineWidth: 0.05,
                    outlineColor: "#000000"
                }, "Press E to Enter")
            );
        };

        // ==================== LEVELS ====================
        const Level0_Wardrobe = ({ playerPosition }) => {
            return React.createElement(React.Fragment, null,
                React.createElement('mesh', { 
                    receiveShadow: true, 
                    rotation: [-Math.PI / 2, 0, 0], 
                    position: [0, 0, 0] 
                },
                    React.createElement('planeGeometry', { args: [15, 15] }),
                    React.createElement('meshStandardMaterial', { color: "#8B4513" })
                ),
                React.createElement(Wardrobe, { position: [0, 1.5, -5], playerPosition: playerPosition }),
                React.createElement('ambientLight', { intensity: 0.4 }),
                React.createElement('pointLight', { position: [0, 5, 0], intensity: 1 })
            );
        };

        const Level1_LanternWaste = ({ playerPosition }) => {
            return React.createElement(React.Fragment, null,
                React.createElement('mesh', { 
                    receiveShadow: true, 
                    rotation: [-Math.PI / 2, 0, 0], 
                    position: [0, 0, 0] 
                },
                    React.createElement('planeGeometry', { args: [50, 50] }),
                    React.createElement('meshStandardMaterial', { color: "#E8E8E8", roughness: 0.9 })
                ),
                React.createElement(SnowParticles, { count: 1000 }),
                React.createElement(LampPost, { position: [0, 2, -8] }),
                React.createElement(NPC, { 
                    position: [-2, 0, -10], 
                    npcId: "tumnus", 
                    playerPosition: playerPosition, 
                    name: "Mr. Tumnus" 
                }),
                React.createElement(Sky, { sunPosition: [0, -1, 0] }),
                React.createElement('ambientLight', { intensity: 0.2 }),
                React.createElement('directionalLight', { 
                    position: [5, 10, 5], 
                    intensity: 0.3, 
                    castShadow: true 
                })
            );
        };

        const Level2_Journey = ({ playerPosition }) => {
            return React.createElement(React.Fragment, null,
                React.createElement('mesh', { 
                    receiveShadow: true, 
                    rotation: [-Math.PI / 2, 0, 0], 
                    position: [0, 0, 0] 
                },
                    React.createElement('planeGeometry', { args: [60, 60] }),
                    React.createElement('meshStandardMaterial', { color: "#F0F0F0", roughness: 0.9 })
                ),
                React.createElement(SnowParticles, { count: 800 }),
                React.createElement(Sky, { sunPosition: [100, 20, 100] }),
                React.createElement('ambientLight', { intensity: 0.5 }),
                React.createElement('directionalLight', { 
                    position: [10, 10, 5], 
                    intensity: 0.8, 
                    castShadow: true 
                })
            );
        };

        const Level3_StoneTable = ({ playerPosition }) => {
            return React.createElement(React.Fragment, null,
                React.createElement('mesh', { 
                    receiveShadow: true, 
                    rotation: [-Math.PI / 2, 0, 0], 
                    position: [0, 0, 0] 
                },
                    React.createElement('planeGeometry', { args: [60, 60] }),
                    React.createElement('meshStandardMaterial', { color: "#90EE90", roughness: 0.9 })
                ),
                React.createElement(Sky, { sunPosition: [100, 50, 100], turbidity: 8, rayleigh: 2 }),
                React.createElement('ambientLight', { intensity: 0.6 }),
                React.createElement('directionalLight', { 
                    position: [10, 10, 5], 
                    intensity: 1, 
                    castShadow: true 
                })
            );
        };

        // ==================== LEVEL MANAGER ====================
        const LevelManager = ({ playerPosition }) => {
            const { currentLevel } = useGameStore();
            
            switch (currentLevel) {
                case 0: return React.createElement(Level0_Wardrobe, { playerPosition });
                case 1: return React.createElement(Level1_LanternWaste, { playerPosition });
                case 2: return React.createElement(Level2_Journey, { playerPosition });
                case 3: return React.createElement(Level3_StoneTable, { playerPosition });
                default: return React.createElement(Level1_LanternWaste, { playerPosition });
            }
        };

        // ==================== UI COMPONENTS ====================
        const DialogueUI = () => {
            const { 
                isDialogueOpen, 
                currentDialogue, 
                dialogueText, 
                dialogueIndex,
                closeDialogue,
                updateDialogueText 
            } = useGameStore();
            
            React.useEffect(() => {
                if (!isDialogueOpen || !currentDialogue) return;
                
                const currentLine = currentDialogue.lines[dialogueIndex];
                if (!currentLine) {
                    closeDialogue();
                    return;
                }
                
                let charIndex = 0;
                const typewriterInterval = setInterval(() => {
                    if (charIndex < currentLine.length) {
                        updateDialogueText(currentLine.substring(0, charIndex + 1), dialogueIndex);
                        charIndex++;
                    } else {
                        clearInterval(typewriterInterval);
                    }
                }, 30);
                
                return () => clearInterval(typewriterInterval);
            }, [isDialogueOpen, currentDialogue, dialogueIndex]);
            
            const handleNext = () => {
                if (dialogueIndex < currentDialogue.lines.length - 1) {
                    updateDialogueText('', dialogueIndex + 1);
                } else {
                    closeDialogue();
                }
            };
            
            if (!isDialogueOpen || !currentDialogue) return null;
            
            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    bottom: '0',
                    left: '0',
                    right: '0',
                    background: 'linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.7))',
                    padding: '30px',
                    color: '#fff',
                    fontFamily: '"Cinzel", serif',
                    zIndex: 1000,
                    borderTop: '3px solid #FFD700'
                }
            },
                React.createElement('div', {
                    style: { 
                        fontSize: '20px', 
                        color: '#FFD700', 
                        marginBottom: '10px',
                        textShadow: '0 0 10px rgba(255,215,0,0.5)'
                    }
                }, currentDialogue.name),
                React.createElement('div', {
                    style: { 
                        fontSize: '18px', 
                        minHeight: '60px',
                        lineHeight: '1.6',
                        marginBottom: '15px'
                    }
                }, dialogueText),
                React.createElement('button', {
                    onClick: handleNext,
                    style: {
                        background: '#FFD700',
                        border: 'none',
                        padding: '12px 30px',
                        fontSize: '16px',
                        cursor: 'pointer',
                        fontFamily: '"Cinzel", serif',
                        color: '#000',
                        borderRadius: '5px',
                        fontWeight: 'bold'
                    }
                }, dialogueIndex < currentDialogue.lines.length - 1 ? 'Next' : 'Close')
            );
        };

        const HUD = () => {
            const { playerHealth, currentLevel } = useGameStore();
            const levelNames = ['The Wardrobe', 'Lantern Waste', 'The Journey', 'Stone Table'];
            
            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    top: '20px',
                    left: '20px',
                    color: '#fff',
                    fontFamily: '"Cinzel", serif',
                    zIndex: 999,
                    textShadow: '2px 2px 4px rgba(0,0,0,0.8)'
                }
            },
                React.createElement('div', {
                    style: { 
                        fontSize: '24px', 
                        marginBottom: '15px',
                        color: '#FFD700'
                    }
                }, levelNames[currentLevel]),
                React.createElement('div', {
                    style: { 
                        fontSize: '18px', 
                        marginBottom: '10px',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '10px'
                    }
                },
                    React.createElement('span', null, 'Health:'),
                    React.createElement('div', {
                        style: {
                            width: '200px',
                            height: '25px',
                            background: 'rgba(0,0,0,0.5)',
                            border: '2px solid #FFD700',
                            borderRadius: '5px',
                            overflow: 'hidden'
                        }
                    },
                        React.createElement('div', {
                            style: {
                                width: `${playerHealth}%`,
                                height: '100%',
                                background: playerHealth > 50 ? '#4CAF50' : playerHealth > 25 ? '#FFA500' : '#F44336',
                                transition: 'width 0.3s, background 0.3s'
                            }
                        })
                    )
                )
            );
        };

        const MenuScreen = () => {
            const { setGameState, setLevel } = useGameStore();
            
            const startGame = () => {
                setLevel(0);
                setGameState('PLAYING');
            };
            
            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    width: '100vw',
                    height: '100vh',
                    background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 2000,
                    fontFamily: '"Cinzel", serif',
                    color: '#fff'
                }
            },
                React.createElement('div', { style: { textAlign: 'center' }},
                    React.createElement('h1', {
                        style: {
                            fontSize: '48px',
                            marginBottom: '20px',
                            color: '#FFD700',
                            textShadow: '0 0 20px rgba(255,215,0,0.5)'
                        }
                    }, 'THE CHRONICLES OF NARNIA'),
                    React.createElement('h2', {
                        style: {
                            fontSize: '24px',
                            marginBottom: '50px',
                            fontStyle: 'italic'
                        }
                    }, 'The Lion, the Witch and the Wardrobe'),
                    React.createElement('button', {
                        onClick: startGame,
                        style: {
                            background: '#FFD700',
                            border: 'none',
                            padding: '20px 60px',
