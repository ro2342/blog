<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia: A Batalha Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* --- ESTILOS GERAIS --- */
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Cinzel', serif; /* Fonte estilo fantasia se disponível */
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        /* --- INTERFACE (HUD) --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* Barra de Vida */
        .health-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 20px; background: #222;
            border: 2px solid #d4af37; border-radius: 10px;
            box-shadow: 0 0 10px #000;
        }
        #health-bar {
            width: 100%; height: 100%; 
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            transition: width 0.2s;
        }

        /* Radar / Minimapa */
        #radar {
            position: absolute; top: 20px; left: 20px;
            width: 80px; height: 80px;
            background: rgba(0,0,0,0.5); border: 2px solid #d4af37;
            border-radius: 50%; overflow: hidden;
        }
        #radar-player {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: #3498db; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 5px cyan;
        }
        .radar-dot {
            position: absolute; width: 4px; height: 4px;
            background: red; border-radius: 50%;
        }

        /* Missão */
        #quest-box {
            position: absolute; top: 60px; width: 100%; text-align: center;
            color: #ffd700; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        /* --- CONTROLES --- */
        #controls-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(212, 175, 55, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        
        #btn-attack {
            position: absolute; bottom: 50px; right: 40px; width: 90px; height: 90px;
            background: rgba(192, 57, 43, 0.8); border-radius: 50%;
            border: 3px solid #fff; color: white; font-size: 40px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer;
            box-shadow: 0 5px 15px #000;
        }
        #btn-attack:active { transform: scale(0.95); background: #ff0000; }

        /* --- TELA INICIAL --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 20, 30, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s; pointer-events: auto;
        }
        h1 { color: #d4af37; font-size: 40px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 10px #d4af37; text-align: center;}
        p { color: #ccc; margin-bottom: 30px; font-size: 14px; max-width: 300px; text-align: center; line-height: 1.5; }
        .btn-start {
            padding: 15px 50px; font-size: 20px; font-weight: bold;
            background: #d4af37; color: #1a1a1a; border: none; border-radius: 4px;
            cursor: pointer; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .btn-start:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="health-container"><div id="health-bar"></div></div>
        <div id="radar"><div id="radar-player"></div></div>
        <div id="quest-box">Carregando Mundo...</div>
    </div>

    <div id="start-screen">
        <h1>Crônicas de<br>Nárnia</h1>
        <p>A Bússola aponta para o inimigo mais próximo.<br>Derrote a Guarda da Feiticeira para abrir o Portal.</p>
        <button class="btn-start" onclick="Game.startGame()">JOGAR</button>
    </div>

    <div id="controls-layer">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-attack">⚔️</div>
    </div>

<script>
/**
 * CONFIGURAÇÕES GERAIS
 */
const CONFIG = {
    colors: {
        sky: 0x87CEEB,
        ground: 0xcfecec, // Neve azulada
        player: 0x2980b9,
        enemy: 0x555555,
        boss: 0x8e44ad,
        gold: 0xd4af37
    },
    mapRadius: 40
};

/**
 * CLASSE PRINCIPAL DO JOGO
 */
class RPGGame {
    constructor() {
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.player = null;
        this.enemies = [];
        this.particles = [];
        this.scenery = [];
        this.clock = new THREE.Clock();
        this.isPlaying = false;
        
        this.input = { x: 0, y: 0, atk: false };
        this.level = 1;
        this.portal = null;
    }

    init() {
        // 1. Configurar Three.js
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(CONFIG.colors.sky);
        this.scene.fog = new THREE.Fog(CONFIG.colors.sky, 15, 60);

        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        this.camera.position.set(0, 18, 14); // Câmera isométrica alta
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        document.body.appendChild(this.renderer.domElement);

        // 2. Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        this.scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        this.scene.add(sunLight);

        // 3. Criar Chão e Cenário (Para não ficar preto no menu)
        this.createEnvironment();
        
        // 4. Setup Inputs
        this.setupControls();

        // 5. Iniciar Loop de Renderização
        this.animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    startGame() {
        document.getElementById('start-screen').style.opacity = 0;
        setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);
        
        this.isPlaying = true;
        this.loadLevel(1);
    }

    loadLevel(lvl) {
        this.level = lvl;
        
        // Limpar nível anterior
        if(this.player) this.scene.remove(this.player.mesh);
        this.enemies.forEach(e => this.scene.remove(e.mesh));
        this.enemies = [];
        if(this.portal) { this.scene.remove(this.portal); this.portal = null; }

        // Criar Jogador
        this.player = new Player(this.scene);
        
        // Spawn Inimigos
        const enemyCount = lvl === 1 ? 3 : (lvl === 2 ? 5 : 1);
        const isBoss = lvl === 3;
        
        for(let i=0; i<enemyCount; i++) {
            this.enemies.push(new Enemy(this.scene, isBoss));
        }

        // Atualizar UI
        const titles = ["Floresta do Lampião", "Represa dos Castores", "Mesa de Pedra"];
        document.getElementById('quest-box').innerText = `${titles[lvl-1]}: Derrote os inimigos!`;
    }

    createEnvironment() {
        // Chão
        const planeGeo = new THREE.PlaneGeometry(120, 120);
        const planeMat = new THREE.MeshLambertMaterial({ color: CONFIG.colors.ground });
        const ground = new THREE.Mesh(planeGeo, planeMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.scene.add(ground);

        // Árvores Procedurais
        for(let i=0; i<60; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 25 + Math.random() * 30; // Longe do centro
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const tree = new THREE.Group();
            
            // Tronco
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.8, 2.5, 6),
                new THREE.MeshLambertMaterial({ color: 0x5d4037 })
            );
            trunk.position.y = 1.25;
            trunk.castShadow = true;
            tree.add(trunk);

            // Folhas (Cones empilhados)
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            const l1 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 4, 8), leavesMat);
            l1.position.y = 4; l1.castShadow = true;
            tree.add(l1);
            
            const l2 = new THREE.Mesh(new THREE.ConeGeometry(2, 3, 8), leavesMat);
            l2.position.y = 6; l2.castShadow = true;
            tree.add(l2);

            tree.position.set(x, 0, z);
            
            // Variação de escala e rotação para realismo
            const scale = 0.8 + Math.random() * 0.5;
            tree.scale.set(scale, scale, scale);
            tree.rotation.y = Math.random() * Math.PI;

            this.scene.add(tree);
            this.scenery.push(tree);
        }
    }

    spawnPortal() {
        const group = new THREE.Group();
        
        // Anel do Portal
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(2, 0.2, 16, 32),
            new THREE.MeshBasicMaterial({ color: CONFIG.colors.gold })
        );
        ring.rotation.x = -Math.PI/2; // Deitado
        ring.position.y = 0.2;
        group.add(ring);

        // Luz (Beam)
        const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(1.8, 1.8, 20, 16, 1, true),
            new THREE.MeshBasicMaterial({ color: CONFIG.colors.gold, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
        );
        beam.position.y = 10;
        group.add(beam);

        group.position.set(0, 0, -15); // Sempre ao Norte
        this.scene.add(group);
        this.portal = group;

        document.getElementById('quest-box').innerText = "PORTAL ABERTO! ENTRE NA LUZ!";
        document.getElementById('quest-box').style.color = "#00ff00";
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        
        const dt = this.clock.getDelta();

        // 1. Lógica do Jogador
        if(this.player && this.isPlaying) {
            this.player.update(this.input, dt);
            
            // Câmera segue jogador
            const targetCam = this.player.mesh.position.clone().add(new THREE.Vector3(0, 18, 14));
            this.camera.position.lerp(targetCam, 0.1);
            this.camera.lookAt(this.player.mesh.position);

            // Bússola (Aponta para inimigo ou portal)
            let target = null;
            if(this.portal) target = this.portal.position;
            else if(this.enemies.length > 0) {
                // Achar o mais próximo
                let minD = Infinity;
                this.enemies.forEach(e => {
                    const d = this.player.mesh.position.distanceTo(e.mesh.position);
                    if(d < minD) { minD = d; target = e.mesh.position; }
                });
            }
            this.player.updateArrow(target);
        }

        // 2. Lógica dos Inimigos
        if(this.isPlaying) {
            this.enemies.forEach(e => e.update(this.player, dt));
        }

        // 3. Checar Portal
        if(this.portal && this.player) {
            this.portal.rotation.y += dt; // Girar efeito
            if(this.player.mesh.position.distanceTo(this.portal.position) < 2) {
                if(this.level < 3) this.loadLevel(this.level + 1);
                else { alert("VITÓRIA!"); location.reload(); }
            }
        }

        // 4. Renderizar Partículas
        this.updateParticles();

        // 5. Renderizar Radar
        this.updateRadar();

        this.renderer.render(this.scene, this.camera);
    }

    updateRadar() {
        const radar = document.getElementById('radar');
        // Limpar pontos antigos (hack rápido)
        const oldDots = document.querySelectorAll('.radar-dot');
        oldDots.forEach(d => d.remove());

        if(!this.player) return;

        this.enemies.forEach(e => {
            const dx = e.mesh.position.x - this.player.mesh.position.x;
            const dz = e.mesh.position.z - this.player.mesh.position.z;
            
            // Escala do radar (dividir por 2 para caber)
            const rx = 40 + (dx * 1.5);
            const ry = 40 + (dz * 1.5);

            if(rx > 0 && rx < 80 && ry > 0 && ry < 80) {
                const dot = document.createElement('div');
                dot.className = 'radar-dot';
                dot.style.left = rx + 'px';
                dot.style.top = ry + 'px';
                radar.appendChild(dot);
            }
        });
    }

    createParticle(pos, color) {
        const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        
        // Velocidade aleatória explosiva
        const vel = new THREE.Vector3(
            (Math.random()-0.5)*0.5,
            Math.random()*0.5,
            (Math.random()-0.5)*0.5
        );

        this.scene.add(mesh);
        this.particles.push({ mesh, vel, life: 1.0 });
    }

    updateParticles() {
        for(let i = this.particles.length-1; i>=0; i--) {
            const p = this.particles[i];
            p.life -= 0.05;
            p.mesh.position.add(p.vel);
            p.mesh.rotation.x += 0.1;
            p.mesh.scale.setScalar(p.life);
            
            if(p.life <= 0) {
                this.scene.remove(p.mesh);
                this.particles.splice(i, 1);
            }
        }
    }

    setupControls() {
        const joy = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let startX, startY;

        // Touch Joystick
        const handleMove = (cx, cy) => {
            const dx = cx - startX;
            const dy = cy - startY;
            const dist = Math.min(Math.sqrt(dx*dx+dy*dy), 40);
            const ang = Math.atan2(dy, dx);
            const kx = Math.cos(ang)*dist;
            const ky = Math.sin(ang)*dist;
            
            knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            this.input.x = kx / 40;
            this.input.y = ky / 40;
        };

        const resetJoy = () => {
            knob.style.transform = `translate(-50%, -50%)`;
            this.input.x = 0; this.input.y = 0;
        };

        joy.addEventListener('touchstart', e => { e.preventDefault(); startX=e.touches[0].clientX; startY=e.touches[0].clientY; });
        joy.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        joy.addEventListener('touchend', resetJoy);

        // Mouse Joystick
        let mouseDown = false;
        joy.addEventListener('mousedown', e => { e.preventDefault(); mouseDown=true; startX=e.clientX; startY=e.clientY; });
        window.addEventListener('mousemove', e => { if(mouseDown) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { mouseDown=false; resetJoy(); });

        // Attack Button
        const btn = document.getElementById('btn-attack');
        const atk = (e) => { 
            if(e) e.preventDefault(); 
            if(this.player) this.player.attack(); 
        };
        btn.addEventListener('touchstart', atk);
        btn.addEventListener('mousedown', atk);
        window.addEventListener('keydown', e => { if(e.code === 'Space' && this.player) this.player.attack(); });
    }
}

/**
 * CLASSE JOGADOR
 */
class Player {
    constructor(scene) {
        this.mesh = new THREE.Group();
        this.hp = 100;
        this.isAttacking = false;
        this.scene = scene;

        // Modelo Visual
        const mat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.player });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.5, 8), mat);
        body.position.y = 0.75; body.castShadow = true;
        this.mesh.add(body);
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
        head.position.y = 1.7; head.castShadow = true;
        this.mesh.add(head);

        // Espada
        this.sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.6, 0.1), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        this.sword.position.set(0.6, 1, 0.5);
        this.sword.rotation.x = Math.PI/2;
        this.mesh.add(this.sword);

        // Seta de Navegação
        this.arrow = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        this.arrow.rotation.x = -Math.PI/2;
        this.arrow.position.y = 0.2; // Bem no chão
        this.arrow.visible = false;
        this.scene.add(this.arrow); // Adicionar na cena, não no player, para girar livre

        scene.add(this.mesh);
    }

    update(input, dt) {
        if(Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1) {
            const speed = 8 * dt;
            const dir = new THREE.Vector3(input.x, 0, input.y).normalize();
            this.mesh.position.add(dir.multiplyScalar(speed));
            
            // Rotação suave
            const targetRot = Math.atan2(dir.x, dir.z);
            this.mesh.rotation.y = targetRot;

            // Limite de Mapa Circular
            if(this.mesh.position.length() > CONFIG.mapRadius) {
                this.mesh.position.setLength(CONFIG.mapRadius);
            }
        }
        
        // Sincronizar posição da seta
        this.arrow.position.x = this.mesh.position.x;
        this.arrow.position.z = this.mesh.position.z;
    }

    updateArrow(targetPos) {
        if(targetPos) {
            this.arrow.visible = true;
            this.arrow.lookAt(targetPos.x, 0.2, targetPos.z);
        } else {
            this.arrow.visible = false;
        }
    }

    attack() {
        if(this.isAttacking) return;
        this.isAttacking = true;

        // Animação Espada
        let f = 0;
        const interval = setInterval(() => {
            f++; this.sword.rotation.y -= 0.6;
            if(f>5) {
                clearInterval(interval);
                this.sword.rotation.y = Math.PI/2;
                this.isAttacking = false;
            }
        }, 20);

        // Verificar Colisões
        Game.enemies.forEach((e, i) => {
            if(this.mesh.position.distanceTo(e.mesh.position) < 3.5) {
                const pDir = new THREE.Vector3(0,0,1).applyQuaternion(this.mesh.quaternion);
                const eDir = e.mesh.position.clone().sub(this.mesh.position).normalize();
                
                // Se estiver na frente (Dot Product > 0.3)
                if(pDir.dot(eDir) > 0.3) {
                    const dead = e.takeDamage();
                    // Feedback Visual
                    Game.createParticle(e.mesh.position, 0xffffff);
                    
                    if(dead) {
                        Game.scene.remove(e.mesh);
                        Game.enemies.splice(i, 1);
                        if(Game.enemies.length === 0) Game.spawnPortal();
                    }
                }
            }
        });
    }
}

/**
 * CLASSE INIMIGO
 */
class Enemy {
    constructor(scene, isBoss) {
        this.mesh = new THREE.Group();
        this.isBoss = isBoss;
        this.hp = isBoss ? 20 : 4;
        this.scene = scene;

        const color = isBoss ? CONFIG.colors.boss : CONFIG.colors.enemy;
        const scale = isBoss ? 2.5 : 1;

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5*scale, 0.6*scale, 1.5*scale, 8), new THREE.MeshStandardMaterial({color: color}));
        body.position.y = 0.75*scale; body.castShadow = true;
        this.mesh.add(body);

        const hood = new THREE.Mesh(new THREE.ConeGeometry(0.6*scale, 0.8*scale, 8), new THREE.MeshStandardMaterial({color: color}));
        hood.position.y = 1.9*scale;
        this.mesh.add(hood);

        // Posição Aleatória
        const angle = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 20;
        this.mesh.position.set(Math.sin(angle)*dist, 0, Math.cos(angle)*dist);

        scene.add(this.mesh);
    }

    update(player, dt) {
        const dist = this.mesh.position.distanceTo(player.mesh.position);
        
        // Perseguir
        if(dist < 20 && dist > 1.5) {
            this.mesh.lookAt(player.mesh.position);
            this.mesh.translateZ((this.isBoss?3:2) * dt);
        }

        // Atacar
        if(dist < 1.5) {
            if(Math.random() < 0.02) {
                player.hp -= 5;
                document.getElementById('health-bar').style.width = player.hp + '%';
                // Efeito de tela vermelha (opcional, simplificado aqui)
                if(player.hp <= 0) {
                    alert("GAME OVER!"); location.reload();
                }
            }
        }
    }

    takeDamage() {
        this.hp--;
        
        // Piscar Branco
        this.mesh.children.forEach(c => c.material.color.setHex(0xffffff));
        setTimeout(() => {
             const col = this.isBoss ? CONFIG.colors.boss : CONFIG.colors.enemy;
             this.mesh.children.forEach(c => c.material.color.setHex(col));
        }, 100);

        // Knockback
        this.mesh.translateZ(-1.5);

        return this.hp <= 0;
    }
}

// Instanciar o jogo globalmente
const Game = new RPGGame();
Game.init();

</script>
</body>
</html>
