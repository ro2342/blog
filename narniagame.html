<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicles of Narnia - 3D Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Cinzel', serif;
            background: #000;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #FFD700;
        }
        
        #loading h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,215,0,0.3);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading">
        <h1>Loading Narnia...</h1>
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 16px; color: #AAA;">This may take a moment</p>
    </div>
    <div id="root"></div>

    <!-- Import map for ES modules -->

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="importmap">
{
    "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.0",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.92.0",
        "zustand": "https://esm.sh/zustand@4.4.7"
    }
}
</script>

<script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect, useMemo } from 'react';
    import ReactDOM from 'react-dom/client';
        import { Canvas, useFrame, useThree } from '@react-three/fiber';
        import { PerspectiveCamera, Text } from '@react-three/drei';
        import { create } from 'zustand';
        import * as THREE from 'three';

        // Remove loading screen
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 2000);

        // ==================== ZUSTAND STORE ====================
        const useGameStore = create((set) => ({
            currentLevel: 0,
            inventory: [],
            playerHealth: 100,
            isDialogueOpen: false,
            currentDialogue: null,
            dialogueText: '',
            dialogueIndex: 0,
            gameState: 'MENU',
            playerPosition: [0, 0, 0],
            
            setLevel: (level) => set({ currentLevel: level }),
            openDialogue: (dialogue) => set({ 
                isDialogueOpen: true, 
                currentDialogue: dialogue,
                dialogueText: '',
                dialogueIndex: 0
            }),
            closeDialogue: () => set({ 
                isDialogueOpen: false, 
                currentDialogue: null,
                dialogueText: '',
                dialogueIndex: 0
            }),
            setGameState: (state) => set({ gameState: state }),
            setPlayerPosition: (pos) => set({ playerPosition: pos }),
            updateDialogueText: (text, index) => set({ dialogueText: text, dialogueIndex: index }),
            resetGame: () => set({
                currentLevel: 0,
                inventory: [],
                playerHealth: 100,
                isDialogueOpen: false,
                currentDialogue: null,
                dialogueText: '',
                dialogueIndex: 0,
                gameState: 'MENU',
                playerPosition: [0, 0, 0]
            })
        }));

        // ==================== DIALOGUE DATA ====================
        const DIALOGUE_DATA = {
            tumnus: {
                id: 'tumnus',
                name: 'Mr. Tumnus',
                lines: [
                    "Good evening! How delightful to meet you!",
                    "I am a Faun. My name is Tumnus.",
                    "Welcome to Narnia, though these are dark times...",
                    "The White Witch has made it always winter.",
                    "You must be careful, her spies are everywhere!"
                ]
            }
        };

        // ==================== KEYBOARD CONTROLLER ====================
        function useKeyboard() {
            const [keys, setKeys] = useState({});
            
            useEffect(() => {
                const handleKeyDown = (e) => setKeys(prev => ({ ...prev, [e.key.toLowerCase()]: true }));
                const handleKeyUp = (e) => setKeys(prev => ({ ...prev, [e.key.toLowerCase()]: false }));
                
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, []);
            
            return keys;
        }

        // ==================== PLAYER ====================
        function Player({ position, onPositionChange }) {
            const meshRef = useRef();
            const velocity = useRef([0, 0, 0]);
            const { isDialogueOpen, gameState } = useGameStore();
            const keys = useKeyboard();
            
            const speed = 0.08;
            const friction = 0.85;
            
            useFrame(() => {
                if (!meshRef.current || gameState !== 'PLAYING' || isDialogueOpen) return;
                
                if (keys['w'] || keys['arrowup']) velocity.current[2] -= speed;
                if (keys['s'] || keys['arrowdown']) velocity.current[2] += speed;
                if (keys['a'] || keys['arrowleft']) velocity.current[0] -= speed;
                if (keys['d'] || keys['arrowright']) velocity.current[0] += speed;
                
                velocity.current[0] *= friction;
                velocity.current[2] *= friction;
                
                meshRef.current.position.x += velocity.current[0];
                meshRef.current.position.z += velocity.current[2];
                
                const bounds = { min: -20, max: 20 };
                meshRef.current.position.x = Math.max(bounds.min, Math.min(bounds.max, meshRef.current.position.x));
                meshRef.current.position.z = Math.max(bounds.min, Math.min(bounds.max, meshRef.current.position.z));
                
                if (Math.abs(velocity.current[0]) > 0.01 || Math.abs(velocity.current[2]) > 0.01) {
                    const angle = Math.atan2(velocity.current[0], velocity.current[2]);
                    meshRef.current.rotation.y = angle;
                }
                
                onPositionChange([
                    meshRef.current.position.x,
                    meshRef.current.position.y,
                    meshRef.current.position.z
                ]);
            });
            
            return (
                <group ref={meshRef} position={position}>
                    <mesh castShadow position={[0, 0.5, 0]}>
                        <capsuleGeometry args={[0.3, 0.6, 8, 16]} />
                        <meshStandardMaterial color="#8B4513" />
                    </mesh>
                    <mesh position={[0, 0.5, 0.4]} castShadow>
                        <sphereGeometry args={[0.15, 16, 16]} />
                        <meshStandardMaterial color="#FFA500" emissive="#FF8C00" emissiveIntensity={0.5} />
                    </mesh>
                    <mesh position={[0, 1.2, 0]} castShadow>
                        <sphereGeometry args={[0.25, 16, 16]} />
                        <meshStandardMaterial color="#FFE4C4" />
                    </mesh>
                </group>
            );
        }

        // ==================== CAMERA CONTROLLER ====================
        function CameraController({ target }) {
            const { camera } = useThree();
            const offset = useRef(new THREE.Vector3(0, 5, 8));
            
            useFrame(() => {
                const targetPos = new THREE.Vector3(target[0], target[1], target[2]);
                const desiredPos = targetPos.clone().add(offset.current);
                camera.position.lerp(desiredPos, 0.1);
                const lookTarget = targetPos.clone();
                lookTarget.y += 1;
                camera.lookAt(lookTarget);
            });
            
            return null;
        }

        // ==================== SNOW PARTICLES ====================
        function SnowParticles({ count = 1000 }) {
            const points = useRef();
            
            const particles = useMemo(() => {
                const positions = new Float32Array(count * 3);
                const velocities = [];
                
                for (let i = 0; i < count; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 50;
                    positions[i * 3 + 1] = Math.random() * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                    velocities.push(Math.random() * 0.02 + 0.01);
                }
                
                return { positions, velocities };
            }, [count]);
            
            useFrame(() => {
                if (!points.current) return;
                const positions = points.current.geometry.attributes.position.array;
                
                for (let i = 0; i < count; i++) {
                    positions[i * 3 + 1] -= particles.velocities[i];
                    if (positions[i * 3 + 1] < 0) {
                        positions[i * 3 + 1] = 20;
                        positions[i * 3] = (Math.random() - 0.5) * 50;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                    }
                }
                points.current.geometry.attributes.position.needsUpdate = true;
            });
            
            return (
                <points ref={points}>
                    <bufferGeometry>
                        <bufferAttribute
                            attach="attributes-position"
                            count={count}
                            array={particles.positions}
                            itemSize={3}
                        />
                    </bufferGeometry>
                    <pointsMaterial
                        size={0.1}
                        color="#FFFFFF"
                        transparent
                        opacity={0.8}
                        sizeAttenuation
                    />
                </points>
            );
        }

        // ==================== LAMP POST ====================
        function LampPost({ position }) {
            return (
                <group position={position}>
                    <mesh castShadow>
                        <cylinderGeometry args={[0.15, 0.15, 4, 8]} />
                        <meshStandardMaterial color="#2C2C2C" metalness={0.8} roughness={0.2} />
                    </mesh>
                    <mesh position={[0, 2.5, 0]} castShadow>
                        <sphereGeometry args={[0.4, 16, 16]} />
                        <meshStandardMaterial 
                            color="#FFD700"
                            emissive="#FFD700"
                            emissiveIntensity={2}
                            toneMapped={false}
                        />
                    </mesh>
                    <pointLight position={[0, 2.5, 0]} color="#FFD700" intensity={10} distance={15} castShadow />
                </group>
            );
        }

        // ==================== NPC ====================
        function NPC({ position, npcId, playerPosition, name = "NPC" }) {
            const meshRef = useRef();
            const { openDialogue, isDialogueOpen, currentDialogue } = useGameStore();
            const [isNearby, setIsNearby] = useState(false);
            
            useFrame(() => {
                if (!meshRef.current) return;
                const dist = Math.sqrt(
                    Math.pow(playerPosition[0] - position[0], 2) +
                    Math.pow(playerPosition[2] - position[2], 2)
                );
                setIsNearby(dist < 2.5);
            });
            
            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === 'e' || e.key === 'E') {
                        if (isNearby && !isDialogueOpen && DIALOGUE_DATA[npcId]) {
                            openDialogue(DIALOGUE_DATA[npcId]);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isNearby, isDialogueOpen, npcId, openDialogue]);
            
            return (
                <group ref={meshRef} position={position}>
                    <mesh castShadow position={[0, 1, 0]}>
                        <capsuleGeometry args={[0.3, 0.8, 8, 16]} />
                        <meshStandardMaterial color="#8B7355" />
                    </mesh>
                    <mesh castShadow position={[0, 1.8, 0]}>
                        <sphereGeometry args={[0.3, 16, 16]} />
                        <meshStandardMaterial color="#D2B48C" />
                    </mesh>
                    <mesh castShadow position={[-0.15, 2.1, 0]} rotation={[0, 0, Math.PI / 6]}>
                        <cylinderGeometry args={[0.05, 0.02, 0.4, 8]} />
                        <meshStandardMaterial color="#8B4513" />
                    </mesh>
                    <mesh castShadow position={[0.15, 2.1, 0]} rotation={[0, 0, -Math.PI / 6]}>
                        <cylinderGeometry args={[0.05, 0.02, 0.4, 8]} />
                        <meshStandardMaterial color="#8B4513" />
                    </mesh>
                    {isNearby && !isDialogueOpen && (
                        <Text
                            position={[0, 2.5, 0]}
                            fontSize={0.3}
                            color="#FFD700"
                            anchorX="center"
                            anchorY="middle"
                            outlineWidth={0.05}
                            outlineColor="#000000"
                        >
                            Press E
                        </Text>
                    )}
                    {isNearby && (
                        <Text
                            position={[0, 2.8, 0]}
                            fontSize={0.2}
                            color="#FFFFFF"
                            anchorX="center"
                            anchorY="middle"
                            outlineWidth={0.03}
                            outlineColor="#000000"
                        >
                            {name}
                        </Text>
                    )}
                </group>
            );
        }

        // ==================== WARDROBE ====================
        function Wardrobe({ position, playerPosition }) {
            const [isNearby, setIsNearby] = useState(false);
            const { setLevel, setGameState } = useGameStore();
            
            useFrame(() => {
                const dist = Math.sqrt(
                    Math.pow(playerPosition[0] - position[0], 2) +
                    Math.pow(playerPosition[2] - position[2], 2)
                );
                setIsNearby(dist < 1.5);
            });
            
            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === 'e' || e.key === 'E') {
                        if (isNearby) {
                            setGameState('CUTSCENE');
                            setTimeout(() => {
                                setLevel(1);
                                setGameState('PLAYING');
                            }, 2000);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isNearby, setLevel, setGameState]);
            
            return (
                <group position={position}>
                    <mesh castShadow receiveShadow>
                        <boxGeometry args={[2, 3, 1]} />
                        <meshStandardMaterial color="#3E2723" roughness={0.8} />
                    </mesh>
                    <mesh position={[-0.5, 0, 0.51]} castShadow>
                        <boxGeometry args={[0.9, 2.8, 0.1]} />
                        <meshStandardMaterial color="#4E342E" roughness={0.7} />
                    </mesh>
                    <mesh position={[0.5, 0, 0.51]} castShadow>
                        <boxGeometry args={[0.9, 2.8, 0.1]} />
                        <meshStandardMaterial color="#4E342E" roughness={0.7} />
                    </mesh>
                    {isNearby && (
                        <>
                            <pointLight position={[0, 0, 0.7]} color="#87CEEB" intensity={2} distance={3} />
                            <Text
                                position={[0, 2, 0.6]}
                                fontSize={0.3}
                                color="#87CEEB"
                                anchorX="center"
                                anchorY="middle"
                                outlineWidth={0.05}
                                outlineColor="#000000"
                            >
                                Press E to Enter
                            </Text>
                        </>
                    )}
                </group>
            );
        }

        // ==================== LEVELS ====================
        function Level0_Wardrobe({ playerPosition }) {
            return (
                <>
                    <mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, 0]}>
                        <planeGeometry args={[15, 15]} />
                        <meshStandardMaterial color="#8B4513" />
                    </mesh>
                    <mesh position={[0, 3, -7.5]}>
                        <boxGeometry args={[15, 6, 0.5]} />
                        <meshStandardMaterial color="#D2B48C" />
                    </mesh>
                    <Wardrobe position={[0, 1.5, -5]} playerPosition={playerPosition} />
                    <ambientLight intensity={0.4} />
                    <pointLight position={[0, 5, 0]} intensity={1} />
                </>
            );
        }

        function Level1_LanternWaste({ playerPosition }) {
            return (
                <>
                    <color attach="background" args={["#0a1929"]} />
                    <fog attach="fog" args={["#0a1929", 10, 50]} />
                    <mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, 0]}>
                        <planeGeometry args={[50, 50]} />
                        <meshStandardMaterial color="#E8E8E8" roughness={0.9} />
                    </mesh>
                    <SnowParticles count={1000} />
                    <LampPost position={[0, 2, -8]} />
                    <NPC position={[-2, 0, -10]} npcId="tumnus" playerPosition={playerPosition} name="Mr. Tumnus" />
                    <ambientLight intensity={0.2} />
                    <directionalLight position={[5, 10, 5]} intensity={0.3} castShadow />
                </>
            );
        }

        function Level2_Journey({ playerPosition }) {
            return (
                <>
                    <color attach="background" args={["#87CEEB"]} />
                    <mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, 0]}>
                        <planeGeometry args={[60, 60]} />
                        <meshStandardMaterial color="#F0F0F0" roughness={0.9} />
                    </mesh>
                    <SnowParticles count={800} />
                    <ambientLight intensity={0.5} />
                    <directionalLight position={[10, 10, 5]} intensity={0.8} castShadow />
                </>
            );
        }

        function Level3_StoneTable({ playerPosition }) {
            return (
                <>
                    <color attach="background" args={["#87CEEB"]} />
                    <mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, 0]}>
                        <planeGeometry args={[60, 60]} />
                        <meshStandardMaterial color="#90EE90" roughness={0.9} />
                    </mesh>
                    <ambientLight intensity={0.6} />
                    <directionalLight position={[10, 10, 5]} intensity={1} castShadow />
                </>
            );
        }

        // ==================== LEVEL MANAGER ====================
        function LevelManager({ playerPosition }) {
            const { currentLevel } = useGameStore();
            
            switch (currentLevel) {
                case 0: return <Level0_Wardrobe playerPosition={playerPosition} />;
                case 1: return <Level1_LanternWaste playerPosition={playerPosition} />;
                case 2: return <Level2_Journey playerPosition={playerPosition} />;
                case 3: return <Level3_StoneTable playerPosition={playerPosition} />;
                default: return <Level1_LanternWaste playerPosition={playerPosition} />;
            }
        }

        // ==================== UI COMPONENTS ====================
        function DialogueUI() {
            const { 
                isDialogueOpen, 
                currentDialogue, 
                dialogueText, 
                dialogueIndex,
                closeDialogue,
                updateDialogueText 
            } = useGameStore();
            
            useEffect(() => {
                if (!isDialogueOpen || !currentDialogue) return;
                
                const currentLine = currentDialogue.lines[dialogueIndex];
                if (!currentLine) {
                    closeDialogue();
                    return;
                }
                
                let charIndex = 0;
                const typewriterInterval = setInterval(() => {
                    if (charIndex < currentLine.length) {
                        updateDialogueText(currentLine.substring(0, charIndex + 1), dialogueIndex);
                        charIndex++;
                    } else {
                        clearInterval(typewriterInterval);
                    }
                }, 30);
                
                return () => clearInterval(typewriterInterval);
            }, [isDialogueOpen, currentDialogue, dialogueIndex]);
            
            const handleNext = () => {
                if (dialogueIndex < currentDialogue.lines.length - 1) {
                    updateDialogueText('', dialogueIndex + 1);
                } else {
                    closeDialogue();
                }
            };
            
            if (!isDialogueOpen || !currentDialogue) return null;
            
            return (
                <div style={{
                    position: 'fixed',
                    bottom: '0',
                    left: '0',
                    right: '0',
                    background: 'linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.7))',
                    padding: '30px',
                    color: '#fff',
                    fontFamily: '"Cinzel", serif',
                    zIndex: 1000,
                    borderTop: '3px solid #FFD700'
                }}>
                    <div style={{ 
                        fontSize: '20px', 
                        color: '#FFD700', 
                        marginBottom: '10px',
                        textShadow: '0 0 10px rgba(255,215,0,0.5)'
                    }}>
                        {currentDialogue.name}
                    </div>
                    <div style={{ 
                        fontSize: '18px', 
                        minHeight: '60px',
                        lineHeight: '1.6',
                        marginBottom: '15px'
                    }}>
                        {dialogueText}
                    </div>
                    <button
                        onClick={handleNext}
                        style={{
                            background: '#FFD700',
                            border: 'none',
                            padding: '12px 30px',
                            fontSize: '16px',
                            cursor: 'pointer',
                            fontFamily: '"Cinzel", serif',
                            color: '#000',
                            borderRadius: '5px',
                            fontWeight: 'bold'
                        }}
                    >
                        {dialogueIndex < currentDialogue.lines.length - 1 ? 'Next' : 'Close'}
                    </button>
                </div>
            );
        }

        function HUD() {
            const { playerHealth, currentLevel } = useGameStore();
            const levelNames = ['The Wardrobe', 'Lantern Waste', 'The Journey', 'Stone Table'];
            
            return (
                <div style={{
                    position: 'fixed',
                    top: '20px',
                    left: '20px',
                    color: '#fff',
                    fontFamily: '"Cinzel", serif',
                    zIndex: 999,
                    textShadow: '2px 2px 4px rgba(0,0,0,0.8)'
                }}>
                    <div style={{ 
                        fontSize: '24px', 
                        marginBottom: '15px',
                        color: '#FFD700'
                    }}>
                        {levelNames[currentLevel]}
                    </div>
                    <div style={{ 
                        fontSize: '18px', 
                        marginBottom: '10px',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '10px'
                    }}>
                        <span>Health:</span>
                        <div style={{
                            width: '200px',
                            height: '25px',
                            background: 'rgba(0,0,0,0.5)',
                            border: '2px solid #FFD700',
                            borderRadius: '5px',
                            overflow: 'hidden'
                        }}>
                            <div style={{
                                width: `${playerHealth}%`,
                                height: '100%',
                                background: playerHealth > 50 ? '#4CAF50' : playerHealth > 25 ? '#FFA500' : '#F44336',
                                transition: 'width 0.3s, background 0.3s'
                            }} />
                        </div>
                    </div>
                </div>
            );
        }

        function MenuScreen() {
            const { setGameState, setLevel } = useGameStore();
            
            const startGame = () => {
                setLevel(0);
                setGameState('PLAYING');
            };
            
            return (
                <div style={{
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    width: '100vw',
                    height: '100vh',
                    background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 2000,
                    fontFamily: '"Cinzel", serif',
                    color: '#fff'
                }}>
                    <div style={{ textAlign: 'center' }}>
                        <h1 style={{
                            fontSize: '48px',
                            marginBottom: '20px',
                            color: '#FFD700',
                            textShadow: '0 0 20px rgba(255,215,0,0.5)'
                        }}>
                            THE CHRONICLES OF NARNIA
                        </h1>
                        <h2 style={{
                            fontSize: '24px',
                            marginBottom: '50px',
                            fontStyle: 'italic',
                            color: '#E8E8E8'
                        }}>
                            The Lion, the Witch and the Wardrobe
                        </h2>
                        <button
                            onClick={startGame}
                            style={{
                                background: '#FFD700',
                                border: 'none',
                                padding: '20px 60px',
                                fontSize: '24px',
                                cursor: 'pointer',
                                fontFamily: '"Cinzel", serif',
                                color: '#000',
                                borderRadius: '10px',
                                fontWeight: 'bold',
                                boxShadow: '0 8px 30px rgba(255,215,0,0.4)',
                                transition: 'all 0.3s'
                            }}
                            onMouseEnter={(e) => {
                                e.target.style.transform = 'scale(1.05)';
                                e.target.style.boxShadow = '0 12px 40px rgba(255,215,0,0.6)';
                            }}
                            onMouseLeave={(e) => {
                                e.target.style.transform = 'scale(1)';
                                e.target.style.boxShadow = '0 8px 30px rgba(255,215,0,0.4)';
                            }}
                        >
                            Begin Adventure
                        </button>
                        <div style={{ marginTop: '50px', fontSize: '16px', color: '#AAA' }}>
                            <p>Controls: WASD to move, E to interact</p>
                            <p style={{ marginTop: '10px' }}>A 3D Adventure Game</p>
                        </div>
                    </div>
                </div>
            );
        }

// ==================== SCENE ====================
function Scene() {
    // O estado da posição deve começar onde o jogador spawna no Level 0
    const [playerPosition, setPlayerPosition] = useState([0, 0, 2]);

    return (
        <>
            {/* A câmera precisa de um componente que a gerencie via useThree */}
            <CameraController target={playerPosition} />
            <Player position={playerPosition} onPositionChange={setPlayerPosition} />
            <LevelManager playerPosition={playerPosition} />
        </>
    );
}

// ==================== MAIN APP ====================
function NarniaAdventure() {
    const { gameState } = useGameStore();

    return (
        <div style={{ width: '100vw', height: '100vh', background: '#000' }}>
            {gameState === 'MENU' && <MenuScreen />}
            
            {/* O Canvas deve ser o container pai de tudo que for 3D */}
            <Canvas shadows camera={{ position: [0, 5, 10], fov: 50 }}>
                <Scene />
            </Canvas>

            {/* UI deve ficar fora do Canvas */}
            {gameState === 'PLAYING' && (
                <>
                    <HUD />
                    <DialogueUI />
                </>
            )}
        </div>
    );
}

        // ==================== RENDER ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NarniaAdventure />);
    </script>
</body>
</html>
