<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narnia Mobile Adventure</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222; 
            font-family: 'Courier New', sans-serif;
            touch-action: none; /* Impede zoom e scroll no celular */
            user-select: none;
        }

        /* --- UI DO JOGO --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .stat-box {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px;
            color: white; font-weight: bold; font-size: 14px;
            border: 2px solid #5c4033;
        }

        #dialog-box {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(255, 250, 240, 0.95); color: #333;
            padding: 15px; border-radius: 10px; border: 3px solid #8b5a2b;
            width: 80%; max-width: 400px; text-align: center;
            display: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto; /* Permite clicar para fechar */
        }

        /* --- CONTROLES DE TOQUE --- */
        #controls-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto;
        }

        /* JOYSTICK (Esquerda) */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px;
            width: 150px; height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            touch-action: none;
        }

        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* BOTÕES DE AÇÃO (Direita) */
        .action-btn {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white; font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            touch-action: none; cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 5px rgba(0,0,0,0.4);
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }

        #btn-attack {
            bottom: 40px; right: 30px;
            width: 80px; height: 80px;
            background: rgba(231, 76, 60, 0.6); /* Vermelho */
        }

        #btn-interact {
            bottom: 140px; right: 50px;
            width: 60px; height: 60px;
            background: rgba(52, 152, 219, 0.6); /* Azul */
        }

        /* TELA DE ROTAÇÃO (Para forçar landscape se quiser, mas aqui deixamos livre) */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999;
        }
        button.start-btn {
            padding: 15px 30px; font-size: 20px;
            background: gold; border: none; border-radius: 5px; margin-top: 20px;
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <h1>NARNIA 3D</h1>
        <p>Aventura de Bolso</p>
        <button class="start-btn" onclick="startGame()">TOCAR PARA INICIAR</button>
        <p style="font-size: 12px; margin-top:20px; color:#888;">Melhor experiência: Celular Deitado</p>
    </div>

    <div id="ui-layer">
        <div class="stat-box">
            ❤ HP: <span id="hp-display">100</span><br>
            ⚔ Inimigos: <span id="score-display">0</span>
        </div>
        <div id="dialog-box" onclick="this.style.display='none'"></div>
    </div>

    <div id="controls-layer" style="display:none;">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        
        <div id="btn-interact" class="action-btn">💬</div>
        <div id="btn-attack" class="action-btn" ontouchstart="triggerAttack(event)">⚔️</div>
    </div>

<script>
    // --- VARIÁVEIS GLOBAIS ---
    let scene, camera, renderer, clock;
    let player, swordMesh;
    let input = { x: 0, y: 0, isAttacking: false };
    let enemies = [], npcs = [], scenery = [];
    let hp = 100, score = 0;
    
    // Joystick Variables
    let joystickActive = false;
    let joystickOrigin = { x: 0, y: 0 };
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('controls-layer').style.display = 'block';
        init3D();
        setupControls();
        animate();
    }

    // --- CONFIGURAÇÃO 3D (THREE.JS) ---
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 50); // Neblina para performance e clima

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 12, 12); 

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Ajustar tela ao girar celular
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        clock = new THREE.Clock();

        // Luzes
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        createWorld();
    }

    // --- CRIAÇÃO DOS OBJETOS (ESTILO BRINQUEDO) ---
    function createDoll(color, type) {
        const group = new THREE.Group();
        
        // Material Simples (Melhor performance no celular)
        const mat = new THREE.MeshLambertMaterial({ color: color });
        const matSkin = new THREE.MeshLambertMaterial({ color: 0xffdbac });

        // Corpo
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.5, 8), mat);
        body.position.y = 0.75;
        body.castShadow = true;
        group.add(body);

        // Cabeça
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), matSkin);
        head.position.y = 1.8;
        head.castShadow = true;
        group.add(head);

        if(type === 'enemy') {
            // Capuz/Barba para inimigos
            const hood = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.8, 8), mat);
            hood.position.y = 2.2;
            group.add(hood);
        }

        return group;
    }

    function createWorld() {
        // Chão
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200), 
            new THREE.MeshLambertMaterial({ color: 0xe0f7fa }) // Neve azulada
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Jogador
        player = createDoll(0x3498db, 'player'); // Azul
        scene.add(player);

        // Espada
        const swordGeo = new THREE.BoxGeometry(0.1, 1.2, 0.1);
        swordMesh = new THREE.Mesh(swordGeo, new THREE.MeshStandardMaterial({color:0xdddddd}));
        swordMesh.position.set(0.6, 1, 0.5);
        swordMesh.rotation.x = Math.PI / 2;
        player.add(swordMesh);

        // Inimigos (Anões)
        for(let i=0; i<6; i++) spawnEnemy();

        // Cenário (Árvores e Pedras)
        for(let i=0; i<30; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 1, 6), new THREE.MeshLambertMaterial({color:0x5d4037}));
            trunk.position.y = 0.5;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 6), new THREE.MeshLambertMaterial({color:0x2e7d32}));
            leaves.position.y = 2;
            tree.add(trunk); tree.add(leaves);
            
            let x = (Math.random()-0.5)*80;
            let z = (Math.random()-0.5)*80;
            if(Math.abs(x) < 5 && Math.abs(z) < 5) x += 10; // Não nascer em cima do player
            tree.position.set(x, 0, z);
            tree.castShadow = true;
            scene.add(tree);
            scenery.push(tree);
        }

        // NPC (Fauno)
        const faun = createDoll(0x8b5a2b, 'player');
        faun.position.set(5, 0, -5);
        faun.userData = { msg: "Sr. Tumnus: 'Cuidado! A Feiticeira sabe que você está aqui. Use a espada!'" };
        scene.add(faun);
        npcs.push(faun);

        // Lampião
        const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshLambertMaterial({color:0x111}));
        lamp.position.set(8, 2, -5);
        scene.add(lamp);
        const light = new THREE.PointLight(0xffd700, 1, 10);
        light.position.set(8, 4, -5);
        scene.add(light);
    }

    function spawnEnemy() {
        const enemy = createDoll(0x555555, 'enemy'); // Cinza
        let angle = Math.random() * Math.PI * 2;
        let dist = 15 + Math.random() * 20;
        enemy.position.set(Math.sin(angle)*dist, 0, Math.cos(angle)*dist);
        enemy.userData = { hp: 3, lastAtk: 0 };
        scene.add(enemy);
        enemies.push(enemy);
    }

    // --- CONTROLES DE TOQUE (JOYSTICK) ---
    function setupControls() {
        // Joystick Logic
        const maxRadius = 35; // Raio máximo do movimento do botão
        
        joyZone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const touch = e.changedTouches[0];
            // Define o centro relativo ao toque inicial se quiser dinâmico, 
            // mas aqui usaremos o centro fixo da div para simplicidade clássica
            const rect = joyZone.getBoundingClientRect();
            joystickOrigin = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateJoystick(touch);
        });

        joyZone.addEventListener('touchmove', (e) => {
            if(!joystickActive) return;
            e.preventDefault(); // Evita scroll
            const touch = e.changedTouches[0];
            updateJoystick(touch);
        });

        const endJoystick = () => {
            joystickActive = false;
            input.x = 0; input.y = 0;
            joyKnob.style.transform = `translate(-50%, -50%)`; // Reseta visual
        };

        joyZone.addEventListener('touchend', endJoystick);
        joyZone.addEventListener('touchcancel', endJoystick);

        // Botão Interagir
        document.getElementById('btn-interact').addEventListener('touchstart', (e) => {
            e.preventDefault();
            checkInteraction();
        });
    }

    function updateJoystick(touch) {
        const dx = touch.clientX - joystickOrigin.x;
        const dy = touch.clientY - joystickOrigin.y;
        const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 35); // 35 é o limite visual
        const angle = Math.atan2(dy, dx);

        // Input normalizado (-1 a 1)
        input.x = (Math.cos(angle) * distance) / 35;
        input.y = (Math.sin(angle) * distance) / 35;

        // Visual
        const knobX = Math.cos(angle) * distance;
        const knobY = Math.sin(angle) * distance;
        joyKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
    }

    function triggerAttack(e) {
        if(e) e.preventDefault();
        if(input.isAttacking) return;

        input.isAttacking = true;
        
        // Animação Espada
        let frame = 0;
        const swing = setInterval(() => {
            frame++;
            swordMesh.rotation.y -= 0.5;
            if(frame > 5) {
                clearInterval(swing);
                swordMesh.rotation.y = 0; // Reset
                input.isAttacking = false;
            }
        }, 30);

        // Lógica de Dano
        enemies.forEach(en => {
            if(player.position.distanceTo(en.position) < 2.5) {
                // Checa se está virado pro inimigo
                const pDir = new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion);
                const eDir = en.position.clone().sub(player.position).normalize();
                if(pDir.dot(eDir) > 0.5) hitEnemy(en);
            }
        });
    }

    function hitEnemy(en) {
        en.userData.hp--;
        // Piscar vermelho
        en.children.forEach(c => c.material.color.setHex(0xff0000));
        setTimeout(() => en.children.forEach(c => c.material.color.setHex(0x555555)), 150);

        if(en.userData.hp <= 0) {
            scene.remove(en);
            enemies = enemies.filter(e => e !== en);
            score++;
            document.getElementById('score-display').innerText = score;
            spawnEnemy(); // Respawn infinito
        }
    }

    function checkInteraction() {
        const box = document.getElementById('dialog-box');
        let found = false;
        npcs.forEach(npc => {
            if(player.position.distanceTo(npc.position) < 3) {
                box.innerText = npc.userData.msg;
                box.style.display = 'block';
                found = true;
            }
        });
        if(!found) box.style.display = 'none';
    }

    // --- LOOP PRINCIPAL ---
    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if(hp <= 0) return; // Game Over pause

        // 1. Mover Jogador (Baseado no Joystick)
        if (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1) {
            const speed = 8 * delta;
            
            // Câmera é fixa relativa ao mundo, então Input Y é Z (Frente/Trás) e Input X é X (Esq/Dir)
            // Mas precisamos inverter Y porque joystick pra cima é negativo no HTML
            const moveVec = new THREE.Vector3(input.x, 0, input.y).normalize(); 
            
            player.position.add(moveVec.multiplyScalar(speed));
            
            // Girar boneco para direção do movimento
            const angle = Math.atan2(moveVec.x, moveVec.z);
            player.rotation.y = angle;
        }

        // 2. Câmera Segue Jogador (Suave)
        const targetCamPos = player.position.clone().add(new THREE.Vector3(0, 10, 10)); // Câmera Isométrica
        camera.position.lerp(targetCamPos, 0.1);
        camera.lookAt(player.position);

        // 3. IA Inimigos
        enemies.forEach(en => {
            const dist = en.position.distanceTo(player.position);
            if(dist < 15 && dist > 1.2) {
                en.lookAt(player.position);
                en.translateZ(3 * delta); // Velocidade do inimigo
            } else if (dist <= 1.2) {
                // Ataque do Inimigo
                if(clock.elapsedTime - en.userData.lastAtk > 1.0) {
                    hp -= 5;
                    document.getElementById('hp-display').innerText = hp;
                    en.userData.lastAtk = clock.elapsedTime;
                    player.children[0].material.color.setHex(0xff0000); // Player pisca
                    setTimeout(()=>player.children[0].material.color.setHex(0x3498db), 200);
                    
                    if(hp <= 0) {
                        document.getElementById('dialog-box').innerText = "GAME OVER";
                        document.getElementById('dialog-box').style.display = 'block';
                    }
                }
            }
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
